<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>BIOSOFÍA</title>
<meta name="description" content="Cuaderno docente: planificación, sesiones, agenda, materiales y seguimiento del alumnado.">
<meta name="theme-color" content="#1b6c60">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BIOSOFÍA"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<script src="nube.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: barra superior con navegación por módulos; contenido a una o dos columnas (principal + lateral) que se apilan en móvil. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#e8eeec; --ink:#16232a; --ink-2:#4a5a61; --muted:#7f8e93; --line:#d2dbd8;
  --accent:#1b6c60; --accent-ink:#ffffff; --accent-soft:#d5eae5;
  --ok:#2c7a4c; --ok-soft:#dbeee1; --warn:#9c620a; --warn-soft:#f5e6c6; --bad:#b03737; --bad-soft:#f6dddd; --info:#2f5fb3; --info-soft:#dde6f6;
  --g1:#1f8a70; --g2:#2f5fb3; --g3:#b98222; --g4:#8a5bb5; --g5:#a8453a; --g6:#6f8f2a; --g7:#c2457a; --g8:#1592a8; --g9:#56616b;
  --font-d:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-b:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,35,40,.06), 0 2px 8px rgba(20,35,40,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101719; --surface:#172124; --surface-2:#1f2b2f; --ink:#e2ebe9; --ink-2:#a5b4b7; --muted:#73858b; --line:#2b393e;
  --accent:#4cb4a0; --accent-ink:#08201b; --accent-soft:#163934;
  --ok:#6ac48d; --ok-soft:#163325; --warn:#e3a94a; --warn-soft:#3a2c12; --bad:#ee7d7d; --bad-soft:#3d1c1c; --info:#7ea6ec; --info-soft:#1b2a45;
  --g1:#3fb592; --g2:#6f98e6; --g3:#dcaa4c; --g4:#b48ade; --g5:#df7a6d; --g6:#9fc155; --g7:#e57aa6; --g8:#4fc3d6; --g9:#9aa5ae;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#101719; --surface:#172124; --surface-2:#1f2b2f; --ink:#e2ebe9; --ink-2:#a5b4b7; --muted:#73858b; --line:#2b393e;
  --accent:#4cb4a0; --accent-ink:#08201b; --accent-soft:#163934;
  --ok:#6ac48d; --ok-soft:#163325; --warn:#e3a94a; --warn-soft:#3a2c12; --bad:#ee7d7d; --bad-soft:#3d1c1c; --info:#7ea6ec; --info-soft:#1b2a45;
  --g1:#3fb592; --g2:#6f98e6; --g3:#dcaa4c; --g4:#b48ade; --g5:#df7a6d; --g6:#9fc155; --g7:#e57aa6; --g8:#4fc3d6; --g9:#9aa5ae;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg); color:var(--ink)}
body{font-family:var(--font-b); font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:var(--font-d); font-weight:700; line-height:1.2; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1.02rem} h4{font-size:.92rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px; margin:0 auto; padding-inline:16px; display:flex; align-items:center; gap:16px; min-height:54px}
.brand{font-family:var(--font-d); font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:8px; white-space:nowrap}
.brand-mark{width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--g1),var(--g2)); display:inline-block}
.nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0; background:none; padding:8px 11px; border-radius:8px; color:var(--ink-2); cursor:pointer; white-space:nowrap; font-weight:700; font-size:.92rem}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent)}
.savestate{font-size:.78rem; color:var(--muted); white-space:nowrap}
.savestate.err{color:var(--bad)}
@media (max-width:760px){ .topbar-in{flex-wrap:wrap; gap:4px 12px; padding-block:8px 4px} .brand{flex:1} .nav{order:3; flex-basis:100%; margin-inline:-6px} }

main{max-width:1240px; margin:0 auto; padding-inline:16px; padding-block:20px 60px}
.banner{max-width:1240px; margin:12px auto 0; padding-inline:16px}
.banner > div{background:var(--warn-soft); color:var(--ink); border-radius:var(--r); padding:10px 14px; font-size:.9rem}

.page-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px}
.page-head .sub{color:var(--ink-2); margin-top:4px}
.cols{display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start}
@media (max-width:900px){ .cols{grid-template-columns:minmax(0,1fr)} }
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1; min-width:0}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.panel > h2, .panel > h3{margin-bottom:10px}
.panel-title{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.label{font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700}
.empty{color:var(--muted); font-size:.9rem; padding:6px 0}
hr{border:0; border-top:1px solid var(--line); margin:12px 0}

.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); padding:7px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--ink); text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent; background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px; font-size:.82rem}
.btn[disabled]{opacity:.5; cursor:default}
.iconbtn{border:0; background:none; cursor:pointer; color:var(--muted); padding:4px 6px; border-radius:6px; font-size:.95rem}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}

.seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; padding:6px 12px; border-radius:7px; cursor:pointer; font-weight:700; font-size:.86rem; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.tabs button{border:0; background:none; padding:10px 14px; cursor:pointer; font-weight:700; color:var(--ink-2); border-bottom:3px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:.76rem; font-weight:700; white-space:nowrap}
.pill.ok{background:var(--ok-soft); color:var(--ok)} .pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.off{background:var(--surface-2); color:var(--muted)}
.pill.info{background:var(--info-soft); color:var(--info)} .pill.acc{background:var(--accent-soft); color:var(--accent)}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; flex:none}
.gchip{display:inline-flex; align-items:center; gap:6px; font-weight:700}
.gchip .sw{width:10px; height:10px; border-radius:3px; flex:none}
.tag{display:inline-block; padding:1px 7px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); font-size:.74rem; font-weight:700; margin:1px 2px 1px 0}

label.f{display:flex; flex-direction:column; gap:4px; font-size:.82rem; font-weight:700; color:var(--ink-2); min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],select,textarea{
  border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; width:100%; min-width:0; font-weight:400; color:var(--ink)}
textarea{resize:vertical; min-height:70px; line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft); border-color:var(--accent)}
.fgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px}
.check{display:inline-flex; align-items:center; gap:6px; font-size:.88rem; cursor:pointer}

/* Línea del día */
.tl{display:flex; flex-direction:column; gap:8px}
.tl-item{display:grid; grid-template-columns:88px 6px minmax(0,1fr) auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; cursor:pointer; text-align:left; width:100%}
.tl-item:hover{border-color:var(--ink-2)}
.tl-time{font-weight:700; font-size:.95rem} .tl-time small{display:block; color:var(--muted); font-weight:400; font-size:.78rem}
.tl-bar{align-self:stretch; border-radius:4px}
.tl-title{font-weight:700} .tl-meta{color:var(--ink-2); font-size:.84rem}
.tl-item.now{outline:2px solid var(--accent); outline-offset:-1px}
.tl-item.off{opacity:.6; cursor:default}
.tl-item.otro{background:var(--surface-2); cursor:default; border-style:dashed}
.cell.otro{background:none; border:1px dashed var(--line); border-left:4px solid var(--muted); cursor:default; min-height:40px}
@media (max-width:560px){ .tl-item{grid-template-columns:62px 5px minmax(0,1fr)} .tl-item > .pill{grid-column:3; justify-self:start} }

.list{display:flex; flex-direction:column}
.li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{font-size:.92rem}
.alert{display:flex; gap:10px; align-items:flex-start; padding:9px 10px; border-radius:8px; font-size:.9rem}
.alert.bad{background:var(--bad-soft)} .alert.warn{background:var(--warn-soft)} .alert.info{background:var(--info-soft)}
.alert b{font-weight:700}

/* Semana */
.wk-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table.wk{border-collapse:collapse; width:100%; min-width:760px}
table.wk th, table.wk td{border-top:1px solid var(--line); border-left:1px solid var(--line); padding:6px; vertical-align:top; text-align:left}
table.wk th{font-family:var(--font-d); font-size:.86rem; background:var(--surface-2)}
table.wk th:first-child, table.wk td:first-child{border-left:0; width:78px; font-size:.8rem; color:var(--ink-2)}
table.wk tr:first-child th{border-top:0}
table.wk th.today{background:var(--accent-soft); color:var(--accent)}
td.fest{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,transparent 6px 12px)}
.cell{display:block; width:100%; text-align:left; border:0; border-left:4px solid; border-radius:6px; padding:6px 8px; background:var(--surface-2); cursor:pointer; min-height:58px}
.cell:hover{filter:brightness(.97)}
.cell .t{font-weight:700; font-size:.84rem; line-height:1.25}
.cell .m{font-size:.74rem; color:var(--ink-2)}
.cell.unplanned .t{color:var(--bad)}

.month{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
.mday{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 8px; min-height:92px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:3px}
.mday.out{opacity:.4}
.mday.fest{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.mday.today{outline:2px solid var(--accent)}
.mday .n{font-family:var(--font-d); font-weight:700}
.mhead{font-family:var(--font-d); font-weight:700; font-size:.85rem; color:var(--ink-2); padding:0 4px}
.mini{font-size:.72rem; line-height:1.3; padding:1px 5px; border-radius:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

table.data.reg{width:auto; min-width:50%}
table.data.reg th, table.data.reg td{text-align:center; padding:4px 8px; min-width:56px}
table.data.reg .stick{position:sticky; left:0; background:var(--surface); text-align:left; z-index:1; white-space:nowrap}
.rcell{border:0; background:none; cursor:pointer; min-width:34px; min-height:28px; border-radius:6px; padding:2px}
.rcell:hover{background:var(--surface-2)}
/* Plano de clase */
.plano-cfg{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; align-items:start}
.plano{display:flex; flex-direction:column; gap:14px; overflow-x:auto; padding-bottom:4px}
.pizarra{align-self:center; background:var(--ink); color:var(--surface); border-radius:6px; padding:6px 40px; font-size:.8rem; font-weight:700; letter-spacing:.04em}
.pfila{display:flex; gap:18px; justify-content:safe center; min-width:min-content}
.pmesa{flex:none; display:grid; gap:4px; padding:6px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line)}
.pmesa .scard{min-height:64px; width:124px}
.pmesa .seat.empty[style]{width:124px; min-height:64px}
.seat{width:118px; min-height:58px; border:1px dashed var(--line); background:var(--surface); border-radius:8px; padding:6px 8px; text-align:left; cursor:pointer; font-size:.84rem; font-weight:700; line-height:1.2}
.seat.empty{color:var(--muted); font-weight:400; text-align:center}
.seat.sel{outline:3px solid var(--accent); outline-offset:-1px}
.seat.drop{background:var(--accent-soft)}
.seat .tg{display:block; font-size:.7rem; color:var(--muted); font-weight:400; margin-top:2px}
.sinsitio{display:flex; flex-wrap:wrap; gap:6px}
.chipal{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 10px; cursor:pointer; font-size:.84rem}
.chipal.sel{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
/* Planificación rápida (formato tabla mensual por semanas) */
table.qp{border-collapse:collapse; width:100%; min-width:760px; table-layout:fixed}
table.qp th, table.qp td{border:1px solid var(--line); padding:0; vertical-align:top; text-align:left}
table.qp th{font-size:.82rem; padding:6px 8px; background:var(--surface-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
table.qp th:first-child, table.qp td.qd{width:58px}
table.qp td.qd{font-family:var(--font-d); font-weight:700; font-size:.85rem; padding:6px 8px; color:var(--ink-2)}
table.qp td.qd.today{color:var(--accent)}
table.qp tr.qout{opacity:.6}
table.qp td.qfest{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px); color:var(--muted); font-size:.8rem; padding:6px 8px}
table.qp td.qc{position:relative}
.qt{display:block; width:100%; border:0; background:transparent; resize:none; padding:6px 22px 6px 8px; font-size:.84rem; line-height:1.3; min-height:44px; color:var(--ink); field-sizing:content; border-radius:0}
.qt:focus{outline:2px solid var(--accent); outline-offset:-2px; background:color-mix(in srgb, var(--surface) 60%, transparent)}
.qsep{border-top:1px dashed color-mix(in srgb, var(--ink) 30%, transparent)}
.qno{font-size:.8rem; color:var(--muted); padding:6px 8px}
.qopen{position:absolute; top:2px; right:2px; border:0; background:none; cursor:pointer; color:var(--ink-2); font-size:.8rem; opacity:0; padding:2px 4px; border-radius:4px}
td.qc:hover .qopen, .qopen:focus{opacity:1}
.qbadge{position:absolute; bottom:2px; right:4px; font-size:.75rem}

/* Secciones plegables y sugerencias */
details.sec{padding:0}
details.sec > summary{list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; flex-wrap:wrap}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary .sec-t{font-family:var(--font-d); font-weight:700; font-size:1.02rem; display:flex; align-items:center; gap:8px}
details.sec > summary .sec-t::before{content:'›'; display:inline-block; transition:transform .15s; color:var(--muted); font-size:1.2rem; line-height:1}
details.sec[open] > summary .sec-t::before{transform:rotate(90deg)}
details.sec .sec-b{padding:0 16px 16px}
.btn.sug{border-color:var(--accent); color:var(--accent)}
.sugbox{border:1px dashed var(--accent); background:var(--accent-soft); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:8px}
.sugpre{white-space:pre-wrap; font-family:var(--font-b); font-size:.9rem; margin:0; line-height:1.45}
.sugitem{display:flex; gap:10px; align-items:flex-start; padding-top:8px; border-top:1px solid var(--line)}
.sugitem:first-of-type{border-top:0; padding-top:0}
.tips{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px}
.tip{background:var(--surface-2); border-radius:8px; padding:8px 10px; margin-top:6px; font-size:.9rem}
.act{padding-bottom:8px; border-bottom:1px solid var(--line)}
.fuentes{border:1px solid var(--accent); border-radius:10px; background:var(--surface); display:flex; flex-direction:column}
.fz{padding:10px 12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px; min-width:0}
.fz:first-of-type{border-top:0}
.fz-h{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; background:var(--accent-soft); border-radius:9px 9px 0 0; font-weight:700; color:var(--accent); font-size:.9rem}
.fz .label{display:flex; align-items:center; gap:6px}
.fz-item{display:flex; gap:10px; align-items:flex-start; padding-top:8px; border-top:1px dashed var(--line); font-size:.9rem}
.fz .label + .fz-item, .fz select + .fz-item{border-top:0; padding-top:0}
.fz-item .grow{min-width:0; overflow-wrap:anywhere}
.fz-sum{display:flex; flex-direction:column; gap:4px; font-size:.88rem}
.fz-sum li{margin:0}
.fz-sum ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:3px}
.tutreu{border-top:1px solid var(--line); padding-top:10px}
.tutreu:first-of-type{border-top:0; padding-top:0}
.pin{border:1px solid var(--accent); border-left:4px solid var(--accent); background:var(--accent-soft); border-radius:8px; padding:8px 10px; display:flex; gap:10px; align-items:flex-start; font-size:.9rem}
.pin .grow{min-width:0; overflow-wrap:anywhere}
.pins{display:flex; flex-direction:column; gap:6px}
.biitem{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.biitem:first-child{border-top:0}
.biitem .grow{min-width:0; overflow-wrap:anywhere}
.aptag{background:var(--accent-soft); color:var(--accent)}
.linkbtn{border:0; background:none; padding:0; margin-top:4px; color:var(--accent); cursor:pointer; font-weight:700; display:block}

/* Banco: elegir una a una */
details.bcat > summary{cursor:pointer;font-weight:700;font-size:.86rem;color:var(--accent);padding:4px 0}
.bitem{display:flex;gap:8px;align-items:flex-start;padding:3px 0 3px 6px;font-size:.88rem;cursor:pointer;line-height:1.35}
.bitem input{margin-top:3px;flex:none}
.bitem.done{cursor:default;opacity:.7}
.bitem.ball{font-weight:700;color:var(--ink-2)}

ej:['El fuego crece, consume oxígeno y «se reproduce», pero no es un ser vivo.','Una semilla seca parece inerte durante años y está viva.','Los virus: el caso frontera que discuten hasta los científicos.'],
er:[['Creen que las plantas no respiran o que solo respiran de noche.','¿Respira una planta a mediodía?','Las plantas respiran siempre; de día además hacen fotosíntesis, que enmascara la respiración.'],['Piensan que solo se mueve lo que está vivo y que lo vivo siempre se mueve.','¿Una seta se mueve? ¿Y una nube?','La relación es responder a estímulos, no desplazarse.'],['Confunden reproducción con crecimiento.','Si una planta saca ramas nuevas, ¿se está reproduciendo?','Reproducirse es originar un individuo nuevo.']],
di:[['La idea de función de relación en plantas.','Mostrar vídeos acelerados de plantas siguiendo la luz o de la mimosa cerrando hojas.'],['Entender que las características se dan juntas.','Tabla de comprobación con objetos y seres: marcar cada característica y discutir los dudosos.']],
pr:['Nombra las tres funciones vitales y un ejemplo de cada una en una planta.','¿Por qué un robot no es un ser vivo?','¿Qué tienen en común una bacteria y un elefante?'],
vo:[['Nutrición','obtener materia y energía'],['Relación','captar estímulos y responder'],['Reproducción','originar descendientes'],['Célula','unidad de todo ser vivo']],
en:[['P','Os enseño cinco objetos: un cristal que crece, una vela, una semilla, un robot aspirador y levadura. ¿Cuáles están vivos?'],['A','Los tardígrados pueden sobrevivir deshidratados años y revivir con agua: ¿estaban vivos mientras tanto?'],['R','En dos minutos, escribid una definición de ser vivo que no deje entrar al fuego.']],
pf:['Astrobiólogo/a: busca señales de vida en otros planetas y necesita definir qué es estar vivo.','Agrónomo/a: controla la nutrición y reproducción de cultivos.','Veterinario/a: vigila las funciones vitales de los animales.'],
vc:['La levadura del pan está viva: por eso la masa sube con calor y no con frío.','Las semillas de la despensa están vivas pero en reposo.','El moho del pan viejo es un ser vivo que se alimenta del pan.'],
ac:[['Búsqueda de vida en Marte y en lunas heladas','Misiones como Perseverance buscan rastros de vida: ¿qué señales buscarían?'],['Inteligencia artificial','¿Una IA que aprende es un ser vivo? Debate usando las funciones vitales.']],
act:[['¿Vivo, muerto o inerte?','Clasifican tarjetas con imágenes (piedra, hoja caída, semilla, virus, fuego) justificando con las funciones vitales.','P',20],['Levadura en globo','Botellas con agua tibia, azúcar y levadura con un globo en la boca; comparan con una sin azúcar.','L',30],['Mapa de funciones','Esquema de las tres funciones vitales aplicadas a su mascota o a una planta de casa.','I',15],['Diseña un alienígena','Inventan un ser vivo de otro planeta y explican cómo realiza cada función vital.','G',40]],
rec:[['Web','Proyecto Biosfera','Unidades interactivas del ministerio sobre los seres vivos.','http://recursostic.educacion.es/ciencias/biosfera/web/'],['Web','Khan Academy: biología','Vídeos y ejercicios sobre las características de la vida.','https://es.khanacademy.org/science/biology'],['Web','NASA: astrobiología','Cómo se busca vida fuera de la Tierra.','https://science.nasa.gov/astrobiology/']]});

B({id:'eso-celula', c:['1eso','3eso','4eso'], t:'La célula y la teoría celular', kw:['celula','celular','teoria celular','procariota','eucariota','organulo','nucleo','membrana','microscop','hooke'],
an:[['La célula es como una ciudad: la membrana es la muralla con puertas, el núcleo el ayuntamiento con los planos, las mitocondrias las centrales eléctricas.','Una ciudad no se divide en dos ciudades iguales; y los orgánulos no tienen voluntad.'],['Los ladrillos de una casa: todos los seres vivos están hechos de células igual que los edificios de piezas.','Los ladrillos son iguales y no están vivos; las células se especializan y cada una está viva.']],
ej:['La yema de un huevo de avestruz es una sola célula enorme.','Tenemos más bacterias en el intestino que células propias en algunos órganos.','Las neuronas de la jirafa pueden medir varios metros.'],
er:[['Creen que las células vegetales no tienen mitocondrias.','¿De dónde saca energía una célula de raíz, que no recibe luz?','Las células vegetales tienen cloroplastos y también mitocondrias.'],['Imaginan la célula plana, como en el dibujo.','¿Qué forma tiene una célula si la tocases?','Usar modelos en 3D (gelatina, bolsa) para ver que tiene volumen.'],['Piensan que todas las células son iguales y del mismo tamaño.','¿Se parece un espermatozoide a una neurona?','Comparar fotos de células especializadas con su función.']],
di:[['Imaginar escalas microscópicas.','Usar la escala interactiva de Learn Genetics y comparar con un grano de arroz o una moneda.'],['Distinguir procariota y eucariota.','Clave rápida: ¿tiene núcleo con membrana? Si no, procariota. Repetir con fotos.']],
pr:['¿Qué dicen los tres principios de la teoría celular?','¿Qué orgánulos tiene una célula vegetal que no tenga una animal?','¿Por qué una bacteria es procariota?'],
vo:[['Membrana plasmática','límite que controla lo que entra y sale'],['Citoplasma','medio interno con orgánulos'],['Núcleo','guarda el ADN'],['Procariota','sin núcleo definido']],
en:[['A','Robert Hooke miró un trozo de corcho en 1665 y vio celdillas como las de un panal: de ahí viene el nombre de célula.'],['P','¿Cuántas células crees que tienes? Apuesta un número antes de dar el dato (unos 30 billones).'],['R','Construye una célula comestible: cada ingrediente debe ser un orgánulo y tienes que justificarlo.']],
pf:['Citotécnico/a: revisa muestras al microscopio para detectar células alteradas.','Investigador/a en cáncer: estudia por qué algunas células se dividen sin control.','Biotecnólogo/a: usa células como fábricas de medicamentos o vacunas.'],
vc:['Las citologías y los análisis de sangre se basan en observar células.','El yogur se hace con bacterias, que son células procariotas.','Las cremas «con células madre» casi nunca llevan células vivas.'],
ac:[['Microscopía de expansión y de superresolución','Hoy se ven estructuras dentro de la célula que hace pocos años eran invisibles.'],['Terapias celulares contra el cáncer (CAR-T)','Se modifican células del propio paciente para que ataquen el tumor.']],
act:[['Célula en 3D','Modelo de célula animal o vegetal con materiales reciclados y leyenda de orgánulos.','G',50],['Observación de células de cebolla y mucosa','Preparaciones con lugol y azul de metileno, dibujo y comparación vegetal/animal.','L',50],['Escala de lo pequeño','Ordenan imágenes (átomo, virus, bacteria, glóbulo rojo, óvulo, pelo) por tamaño y comprueban con la escala interactiva.','P',20],['Cómic de la teoría celular','Viñetas con Hooke, Leeuwenhoek, Schleiden, Schwann y Virchow.','I',40]],
rec:[['Interactivo','Escala de las células (Learn Genetics)','Zoom desde un grano de café hasta un átomo.','https://learn.genetics.utah.edu/content/cells/scale/'],['Interactivo','Dentro de una célula (Learn Genetics)','Recorrido por los orgánulos de una célula animal.','https://learn.genetics.utah.edu/content/cells/insideacell/'],['Web','Atlas de histología vegetal y animal (Univ. de Vigo)','Fotos y explicaciones de la célula y sus orgánulos.','https://mmegias.webs.uvigo.es/'],['Web','CellsAlive','Modelos interactivos de células animal, vegetal y bacteriana.','https://www.cellsalive.com/']]});

B({id:'eso-nutricionsv', c:['1eso'], t:'Nutrición autótrofa y heterótrofa', kw:['autotrof','heterotrof','fotosintesis','nutricion de las plantas','nutricion de los seres','respiracion celular','clorofila','savia'],
an:[['La fotosíntesis es una cocina solar: con ingredientes sencillos (agua, CO2) y la energía de la luz, la planta cocina azúcar.','En una cocina el cocinero decide; en la hoja ocurre por reacciones químicas.'],['Los autótrofos son como quien cultiva su huerto; los heterótrofos, como quien va al supermercado.','Ningún ser vivo «decide» su tipo de nutrición.']],
ej:['La mayor parte de la masa de un árbol procede del CO2 del aire, no del suelo.','La planta carnívora Drosera hace fotosíntesis y además caza insectos para conseguir nitrógeno.','Las setas son heterótrofas aunque estén en el suelo como las plantas.'],
er:[['Creen que las plantas se alimentan de la tierra.','Si una planta pesa 10 kg más tras 5 años, ¿pesa 10 kg menos la maceta?','Experimento de Van Helmont: el suelo apenas pierde masa; el carbono viene del aire.'],['Piensan que la fotosíntesis sustituye a la respiración.','¿Qué hace la planta por la noche para obtener energía?','Las dos ocurren: la fotosíntesis fabrica alimento y la respiración lo usa.'],['Confunden respiración (celular) con ventilación.','¿Respiran las células de tu dedo?','Respiración celular: usar oxígeno para sacar energía del alimento, en cada célula.']],
di:[['Que el aire (un gas) aporte masa.','Pesar un trozo de madera seca y quemarlo: lo que se va al aire es casi todo.'],['Relacionar ingredientes y productos.','Ecuación con dibujos (gota, nube, sol → azúcar, burbujas) antes que con fórmulas.']],
pr:['¿Qué necesita una planta para hacer la fotosíntesis?','¿De dónde sale el oxígeno que respiramos?','¿Por qué un hongo es heterótrofo?'],
vo:[['Autótrofo','fabrica su materia orgánica'],['Heterótrofo','la toma de otros seres'],['Clorofila','pigmento que capta la luz'],['Estoma','poro de la hoja']],
en:[['P','Un árbol enorme sale de una semilla diminuta. ¿De dónde sacó todo ese material?'],['A','Van Helmont plantó un sauce en una maceta pesada y cinco años después la tierra pesaba casi lo mismo.'],['R','Encuentra en el patio un ser autótrofo y uno heterótrofo que no sean una planta ni un animal.']],
pf:['Ingeniero/a agrónomo/a: optimiza luz, agua y abonos en los cultivos.','Técnico/a de jardinería y viveros: aplica la nutrición vegetal cada día.','Investigador/a en algas para biocombustibles.'],
vc:['Las plantas de interior necesitan luz, no solo agua.','Los invernaderos de Almería aumentan el CO2 para que las plantas crezcan más.','Las verduras que comemos son, en gran parte, CO2 del aire transformado.'],
ac:[['Fotosíntesis artificial','Investigadores intentan imitar la hoja para producir combustibles con luz solar.'],['Récords de CO2 atmosférico','Las plantas absorben parte del CO2 que emitimos, pero no todo.']],
act:[['Hojas que burbujean','Hojas de espinaca en agua con bicarbonato bajo una lámpara: cuentan las que flotan.','L',40],['Almidón en la hoja','Tapan media hoja con papel de aluminio dos días y revelan el almidón con lugol.','L',50],['¿Qué come quién?','Clasifican seres vivos de una lista en autótrofos y heterótrofos y justifican los casos raros.','P',20],['El misterio del sauce','Leen el experimento de Van Helmont y escriben qué conclusión sacarían ellos.','I',20]],
rec:[['Web','Biomodel (Universidad de Alcalá)','Modelos y animaciones de metabolismo y fotosíntesis.','https://biomodel.uah.es/'],['Web','Proyecto Biosfera','Unidades sobre la nutrición de los seres vivos.','http://recursostic.educacion.es/ciencias/biosfera/web/'],['Web','Khan Academy: fotosíntesis','Explicaciones en vídeo y ejercicios.','https://es.khanacademy.org/science/biology']]});

B({id:'eso-reproduccion', c:['1eso'], t:'Reproducción y ciclos biológicos', kw:['reproduccion','asexual','sexual','ciclo biologic','ciclo vital','gameto','espora','gemacion','esqueje','polinizacion','metamorfosis'],
an:[['La reproducción asexual es una fotocopiadora: rápida y barata, pero todas las copias son iguales.','Las copias asexuales pueden tener pequeñas mutaciones; no son perfectas.'],['La sexual es como barajar dos mazos de cartas: cada hijo recibe una mano distinta.','En la baraja todo es azar; en la herencia hay reglas.']],
ej:['Las fresas se reproducen por estolones que echan raíces.','Las hidras forman yemas que se separan y crecen.','Los helechos alternan una fase con esporas y otra con gametos.'],
er:[['Creen que las plantas no tienen reproducción sexual.','¿Para qué sirven las flores?','La flor es el órgano sexual: polen y óvulos.'],['Piensan que asexual significa «sin sexo, por tanto peor».','¿Por qué las bacterias tienen tanto éxito?','Cada tipo tiene ventajas: rapidez frente a variabilidad.'],['Confunden espora con semilla.','¿Una espora lleva un embrión dentro?','La semilla tiene embrión y reservas; la espora es una sola célula.']],
di:[['Los ciclos con alternancia de generaciones.','Dibujar el ciclo como un reloj con dos colores (fase de esporas y fase de gametos).'],['Que la variabilidad sea una ventaja.','Simulación con dados: población clónica frente a variada ante una «enfermedad».']],
pr:['Di una ventaja y un inconveniente de la reproducción asexual.','¿Qué es la polinización y quién la hace?','¿Qué es una metamorfosis? Pon un ejemplo.'],
vo:[['Gameto','célula sexual'],['Fecundación','unión de gametos'],['Espora','célula reproductora asexual'],['Clon','individuo genéticamente idéntico']],
en:[['A','Todos los plátanos Cavendish del supermercado son clones: una sola enfermedad podría acabar con ellos.'],['P','¿Por qué las abejas son tan importantes para que comamos fruta?'],['R','Haz que un esqueje de potus o de geranio saque raíces en un vaso de agua.']],
pf:['Viverista: multiplica plantas por esquejes, injertos y semillas.','Apicultor/a: cuida a los polinizadores.','Técnico/a en reproducción animal en granjas y zoológicos.'],
vc:['Las patatas que brotan en la despensa son reproducción asexual.','Las frutas sin semillas se consiguen manipulando la reproducción.','Los injertos de naranjos combinan dos plantas.'],
ac:[['Declive de los polinizadores','La pérdida de abejas y otros insectos amenaza cultivos.'],['Plaga del banano (Fusarium TR4)','Muestra el riesgo de depender de clones.']],
act:[['Taller de esquejes','Cada alumno prepara un esqueje y registra su evolución en un diario durante dos semanas.','C',20],['Disección de una flor','Identifican sépalos, pétalos, estambres y pistilo y dibujan.','L',40],['Clones contra la plaga','Juego con dados: una población clónica y otra variada ante una enfermedad aleatoria.','G',25],['Ciclos en cartulina','Por grupos, ciclo de vida de un helecho, una rana, una mariposa y una bacteria.','G',40]],
rec:[['Web','Proyecto Biosfera','Unidades sobre la reproducción de los seres vivos.','http://recursostic.educacion.es/ciencias/biosfera/web/'],['Web','Animal Diversity Web','Fichas de reproducción y ciclos de vida de muchas especies.','https://animaldiversity.org/'],['Web','Arbolapp (CSIC)','Árboles de la península con flores, frutos y semillas.','https://www.arbolapp.es/']]});

B({id:'eso-clasificacion', c:['1eso'], t:'Clasificación de los seres vivos', kw:['clasificacion de los seres vivos','clasificacion','taxonom','especie','nomenclatura binom','reino','dominio','linneo','categorias taxon','genero'],
an:[['La clasificación es como las direcciones postales: país, provincia, ciudad, calle y número; reino, filo, clase, orden, familia, género y especie.','Las direcciones son arbitrarias; la clasificación intenta reflejar el parentesco evolutivo.'],['Ordenar el armario: cada uno lo haría distinto si no hay un criterio común.','En el armario no hay parentesco entre camisetas.']],
ej:['El lobo y el perro son la misma especie (Canis lupus).','La ballena no es un pez aunque viva en el mar.','Las setas no son plantas: su reino está más cerca del de los animales.'],
er:[['Clasifican por el lugar donde viven o por la utilidad.','¿Delfín y tiburón van juntos?','Usar características internas y de parentesco: el delfín es mamífero.'],['Escriben mal el nombre científico.','¿Cómo se escribe correctamente el nombre del ser humano?','Género con mayúscula, especie en minúscula, en cursiva o subrayado: Homo sapiens.'],['Creen que especie es sinónimo de «tipo de animal».','¿Un burro y un caballo son la misma especie?','Especie: pueden tener descendencia fértil.']],
di:[['Memorizar la jerarquía.','Regla mnemotécnica inventada por el grupo y repetición con un ejemplo cercano (gato doméstico).'],['Entender por qué cambian las clasificaciones.','Contar el caso de los hongos o de las aves dentro de los reptiles.']],
pr:['¿Qué es una especie?','Ordena: familia, reino, especie, clase, género, orden, filo.','¿Por qué usamos nombres en latín?'],
vo:[['Taxón','grupo de clasificación'],['Especie','descendencia fértil'],['Nomenclatura binomial','género + especie'],['Dominio','categoría más amplia']],
en:[['P','¿Cómo se llama este pez? En Valencia, Cádiz y Galicia le llaman distinto. Por eso hace falta un nombre científico.'],['A','Linneo puso nombre a miles de especies; algunos científicos han bautizado especies con nombres de famosos.'],['R','Clasifica 15 objetos del estuche con un sistema jerárquico que tus compañeros entiendan.']],
pf:['Taxónomo/a en un museo de ciencias naturales.','Técnico/a de medio ambiente que identifica especies protegidas.','Bioinformático/a que compara ADN para clasificar.'],
vc:['Los supermercados organizan los productos con criterios jerárquicos parecidos.','En las cartas de los restaurantes el mismo pescado tiene nombres distintos según la zona.','Las guías de setas evitan intoxicaciones por confusión de especies.'],
ac:[['Descubrimiento de nuevas especies cada año','Se describen miles al año, muchas de insectos y del fondo marino.'],['Especies con nombres de personajes famosos','Sirve para explicar la nomenclatura binomial.']],
act:[['Clasifica tu estuche','Por grupos crean una clasificación jerárquica de objetos y otro grupo la pone a prueba.','G',25],['Ficha de identidad','Buscan la clasificación completa de su animal favorito y la presentan como un DNI.','I',30],['¿Quién es pariente de quién?','Ordenan tarjetas de animales por parecido y luego comparan con el árbol real.','P',20],['Caza de nombres científicos','En el patio o el barrio fotografían seres vivos y buscan su nombre científico.','K',50]],
rec:[['Árbol interactivo','OneZoom','Árbol de la vida navegable con todas las especies conocidas.','https://www.onezoom.org/'],['Base de datos','GBIF','Datos y mapas de distribución de especies.','https://www.gbif.org/'],['Ciencia ciudadana','iNaturalist','Identificación de especies con fotos y comunidad de expertos.','https://www.inaturalist.org/']]});

B({id:'eso-microorg', c:['1eso'], t:'Bacterias, protoctistas y hongos', kw:['bacteria','monera','protoctista','protista','protozoo','alga','hongo','seta','moho','levadura','microorganism','liquen'],
an:[['Los hongos son el servicio de reciclaje del bosque: deshacen hojas y troncos y devuelven los nutrientes al suelo.','El reciclaje humano separa materiales; los hongos los digieren químicamente.'],['La seta es como la manzana de un manzano escondido bajo tierra: lo importante es el micelio.','El manzano hace fotosíntesis; el hongo no.']],
ej:['Uno de los seres vivos más grandes del mundo es un hongo de Oregón que ocupa casi 10 km² bajo tierra.','Las algas producen buena parte del oxígeno del planeta.','La levadura del pan y la cerveza es un hongo unicelular.'],
er:[['Creen que todas las bacterias son malas.','¿Qué bacterias te ayudan a ti?','Flora intestinal, yogur, ciclos de nutrientes: la mayoría son beneficiosas.'],['Piensan que las setas son plantas.','¿Una seta tiene clorofila?','Son heterótrofas, con quitina, en otro reino.'],['Creen que las algas son plantas.','¿Una diatomea es pluricelular?','Muchas algas son protoctistas unicelulares.']],
di:[['Imaginar organismos invisibles.','Cultivar en placas o en pan y ver que crecen colonias visibles a partir de células invisibles.'],['El reino Protoctista, tan variado.','Presentarlo como el «cajón de sastre» de eucariotas que no son animales, plantas ni hongos.']],
pr:['¿En qué se diferencia una bacteria de un protozoo?','¿Por qué los hongos no son plantas?','Pon un ejemplo de bacteria útil y uno de perjudicial.'],
vo:[['Micelio','red de hifas del hongo'],['Descomponedor','recicla materia orgánica'],['Colonia','grupo visible de microorganismos'],['Liquen','hongo + alga']],
en:[['R','Dejamos un trozo de pan húmedo en una bolsa: apuesta qué color tendrá el moho dentro de una semana.'],['A','La penicilina sale de un moho, Penicillium, que contaminó por casualidad una placa de Fleming.'],['P','¿Hay más bacterias en tu móvil o en la tapa del inodoro?']],
pf:['Microbiólogo/a de alimentos: controla que lo que comemos sea seguro.','Micólogo/a: estudia hongos y asesora en intoxicaciones.','Técnico/a de depuradora: usa bacterias para limpiar el agua.'],
vc:['Yogur, queso, pan y vinagre se hacen con microorganismos.','La nevera retrasa el crecimiento de bacterias y mohos.','El pie de atleta y la caspa pueden deberse a hongos.'],
ac:[['Resistencia a los antibióticos','Las bacterias se vuelven resistentes si usamos mal los antibióticos.'],['Mareas rojas y algas tóxicas','Proliferaciones de microalgas que cierran playas o bateas de mejillón.']],
act:[['Cultivo de mohos','Pan, fruta y queso en bolsas con distintas condiciones; registran crecimiento y lo relacionan con la conservación.','L',30],['Bacterias de mi entorno','Placas con agar: tocan móvil, pomo y manos antes y después de lavarlas.','L',40],['Levadura que infla globos','Comparan producción de gas con distintas temperaturas.','L',30],['Póster del reino','Por grupos, un reino con ejemplos útiles y perjudiciales.','G',45]],
rec:[['Web','e-Bug','Recursos didácticos sobre microbios, higiene y antibióticos en varios idiomas.','https://www.e-bug.eu/'],['Web','Biodiversidad Virtual','Fotos de hongos y líquenes identificados en la península.','https://www.biodiversidadvirtual.org/'],['Web','Resistencia a antibióticos (PRAN)','Campañas y materiales del Plan Nacional frente a la resistencia.','https://resistenciaantibioticos.es/']]});

B({id:'eso-plantas', c:['1eso'], t:'Las plantas', kw:['planta','vegetal','musgo','helecho','gimnosperma','angiosperma','flor','raiz','tallo','hoja','semilla','fruto','briofit','pteridofit','espermatofit'],
an:[['Las raíces y los vasos son las tuberías de un edificio: agua hacia arriba, azúcar repartido por todas las plantas.','En las tuberías el agua se bombea; en la planta sube por evaporación en las hojas.'],['La semilla es una fiambrera con un bebé dormido y su comida dentro.','El embrión no está «dormido» en sentido literal, su metabolismo es muy bajo.']],
ej:['El pino es una gimnosperma: sus semillas (piñones) no están dentro de un fruto.','Los musgos no tienen vasos, por eso son pequeños y viven en sitios húmedos.','La posidonia del Mediterráneo es una planta con flor, no un alga.'],
er:[['Creen que todas las plantas tienen flores.','¿Tiene flores un helecho?','Musgos y helechos se reproducen por esporas.'],['Piensan que el fruto es siempre dulce.','¿Es un fruto el tomate? ¿Y el pimiento?','Fruto = ovario desarrollado con semillas.'],['Creen que la posidonia es un alga.','¿Tiene flores la posidonia?','Es una planta con raíces, tallo, hojas, flores y frutos.']],
di:[['Diferenciar los grandes grupos.','Clave con tres preguntas: ¿vasos? ¿semillas? ¿fruto?'],['La transpiración.','Bolsa de plástico atada a una rama al sol: en una hora aparece agua.']],
pr:['¿Qué diferencia una gimnosperma de una angiosperma?','¿Por qué los musgos son pequeños?','¿Qué función tienen los estomas?'],
vo:[['Xilema','conduce savia bruta'],['Floema','conduce savia elaborada'],['Estoma','poro de intercambio de gases'],['Espermatofita','planta con semillas']],
en:[['P','¿El tomate es fruta o verdura? Cada uno vota y luego lo resolvemos con biología.'],['A','Algunas praderas de posidonia son de los seres vivos más antiguos del planeta: miles de años clonándose.'],['R','Encuentra en el patio un ejemplo de cada gran grupo de plantas.']],

B({id:'eso-universo', c:['1eso','4eso'], t:'La Tierra en el Universo', kw:['universo','sistema solar','planeta','galaxia','estrella','luna','movimientos de la tierra','rotacion','traslacion','estaciones','eclipse','fases lunares','big bang','astro'],
an:[['Si el Sol fuera una pelota de playa en el centro del campo de fútbol, la Tierra sería un guisante a unos 100 metros.','A esa escala las distancias a otras estrellas no caben ni en el país.'],['Las estaciones son como una linterna sobre una mesa: si la inclinas, la luz se reparte en más superficie y calienta menos.','No es la distancia al Sol la que cambia las estaciones, sino la inclinación.']],
ej:['La Tierra está más cerca del Sol en enero que en julio.','La luz del Sol tarda unos 8 minutos en llegar: vemos el Sol como era hace 8 minutos.','Hay más estrellas en el universo que granos de arena en todas las playas de la Tierra.'],
er:[['Creen que en verano hace calor porque estamos más cerca del Sol.','¿Por qué en Australia es verano en diciembre?','La inclinación del eje cambia el ángulo de los rayos y las horas de luz.'],['Piensan que las fases de la Luna son la sombra de la Tierra.','¿Hay un eclipse cada vez que hay cuarto creciente?','Las fases dependen de qué parte iluminada vemos; la sombra es el eclipse.'],['Confunden estrella, planeta y galaxia.','¿El Sol es una estrella?','Escala jerárquica: planeta < sistema planetario < galaxia < universo.']],
di:[['Las escalas astronómicas.','Modelo a escala en el pasillo o el patio con papel higiénico (un trozo = una distancia).'],['Visualizar los movimientos.','Representarlos con alumnos: uno es el Sol y otro gira y se traslada con una linterna.']],
pr:['¿Por qué hay día y noche?','¿Qué causa las estaciones?','¿Por qué vemos siempre la misma cara de la Luna?'],
vo:[['Rotación','giro sobre su eje: día y noche'],['Traslación','vuelta al Sol: un año'],['Año luz','distancia, no tiempo'],['Galaxia','conjunto de miles de millones de estrellas']],
en:[['P','¿Por qué en verano hace calor? Votad: porque estamos más cerca del Sol, o por otra razón.'],['A','Las primeras imágenes del telescopio James Webb (2022) mostraban galaxias cuya luz salió hace más de 13 000 millones de años.'],['R','Modelo del sistema solar a escala con papel higiénico a lo largo del pasillo.']],
pf:['Astrofísico/a en observatorios como los de Canarias.','Ingeniero/a aeroespacial.','Divulgador/a en planetarios como el Hemisfèric.'],
vc:['El horario de verano y la duración del día dependen de los movimientos de la Tierra.','El GPS necesita satélites y corregir efectos de la relatividad.','Las mareas dependen de la Luna.'],
ac:[['Telescopio espacial James Webb','Imágenes de galaxias primitivas y atmósferas de exoplanetas.'],['Programa Artemis de vuelta a la Luna','Misiones tripuladas previstas en esta década.']],
act:[['Sistema solar en papel higiénico','Modelo a escala de distancias en el pasillo; reflexión sobre lo vacío que está el espacio.','G',40],['Estaciones con linterna','Linterna y bola inclinada para explicar por qué cambian las estaciones.','G',25],['Diario lunar','Dibujan la Luna cada noche durante dos semanas y deducen el ciclo.','C',10],['Planeta a medida','Por grupos, ficha de un planeta: ¿podríamos vivir allí?','G',45]],

B({id:'eso-estructuratierra', c:['1eso'], t:'Estructura de la Tierra', kw:['estructura de la tierra','capas de la tierra','corteza','manto','nucleo terrestre','geosfera','litosfera','interior de la tierra','discontinuidad'],

B({id:'eso-mineralesrocas', c:['1eso'], t:'Minerales y rocas', kw:['mineral','roca','cristal','dureza','mohs','raya','exfoliacion','brillo','granito','caliza','marmol','sedimentaria','ignea','magmatica','metamorfica','ciclo de las rocas'],

er:[['Confunden efecto invernadero con agujero de ozono.','¿El agujero de ozono calienta la Tierra?','Son problemas distintos con gases y efectos distintos.'],['Creen que el efecto invernadero es malo en sí.','¿Qué pasaría si no existiera?','Es natural y necesario; el problema es su aumento.'],['Confunden tiempo y clima.','¿Un día de frío desmiente el calentamiento global?','Tiempo: días; clima: promedios de décadas.']],
di:[['Imaginar que el aire pesa.','Experimento del vaso con agua y cartulina boca abajo.'],['Entender la radiación.','Termómetros en dos botellas al sol, una con CO2 (bicarbonato y vinagre).']],

vo:[['Troposfera','capa del tiempo atmosférico'],['Estratosfera','capa del ozono'],['Gas de efecto invernadero','retiene calor'],['Clima','media de muchos años']],

pf:['Meteorólogo/a en AEMET.','Técnico/a de calidad del aire.','Climatólogo/a que modela el clima futuro.'],
vc:['La previsión meteorológica decide qué ropa llevamos.','El índice UV indica cuándo protegerse del sol.','Los avisos por calidad del aire limitan el tráfico en algunas ciudades.'],
ac:[['Años récord de temperatura','2023 y 2024 se registraron como los años más cálidos desde que hay medidas.'],['Recuperación del ozono','La ONU estima que la capa se recuperará en las próximas décadas.']],
act:[['El aire pesa','Experimentos rápidos: vaso y cartulina, globo en botella caliente, lata que se arruga.','L',30],['Invernadero en botella','Dos botellas al sol, una con más CO2; registran la temperatura cada 5 minutos y grafican.','L',45],['Mapa del tiempo','Interpretan un mapa de isobaras de AEMET y hacen la previsión del día.','P',30],['Estación meteorológica escolar','Registran temperatura, presión y lluvia durante un mes.','C',10]],

pf:['Técnico/a de depuradora o potabilizadora.','Hidrogeólogo/a: estudia acuíferos.','Ingeniero/a de caminos que diseña presas y canales.'],

B({id:'eso-ecosistemas', c:['1eso','3eso','4eso'], t:'Ecosistemas y relaciones', kw:['ecosistema','biotopo','biocenosis','factor abiotico','factor biotico','cadena trofica','red trofica','productor','consumidor','descomponedor','relaciones interespecific','relaciones intraespecific','parasitismo','mutualismo','depredacion','competencia','simbiosis'],

ej:['Al reintroducir lobos en Yellowstone cambió hasta el curso de los ríos.','Los líquenes son un mutualismo entre hongo y alga.','El cuco pone sus huevos en nidos ajenos: parasitismo de puesta.'],
er:[['Creen que las flechas de la cadena trófica significan «come a».','En hierba → conejo, ¿la hierba se come al conejo?','La flecha indica hacia dónde va la energía.'],['Olvidan a los descomponedores.','¿Qué pasa con un animal muerto en el bosque?','Hongos y bacterias cierran el ciclo de la materia.'],['Piensan que los depredadores son malos para el ecosistema.','¿Qué pasaría con los conejos si no hubiera zorros?','Los depredadores regulan las poblaciones.']],
di:[['Diferenciar relaciones.','Tabla con quién gana (+), quién pierde (-) y quién queda igual (0).'],['Ver el ecosistema como un sistema.','Juego de la red con una cuerda entre alumnos que representan especies.']],
pr:['¿Qué es un factor abiótico? Pon dos ejemplos.','¿Qué papel tienen los descomponedores?','¿Qué tipo de relación es la de una garrapata y un perro?'],
vo:[['Biotopo','medio físico'],['Biocenosis','conjunto de seres vivos'],['Nivel trófico','posición en la cadena'],['Mutualismo','ambos se benefician']],
en:[['A','Cuando volvieron los lobos a Yellowstone, los ciervos dejaron de comer en las orillas, crecieron árboles y los ríos cambiaron.'],['R','Con una cuerda, conectad a los alumnos-especie de una red trófica y veamos qué pasa si alguien se suelta.'],['P','¿Qué come lo que come lo que tú comes en el desayuno?']],
pf:['Ecólogo/a de campo.','Técnico/a de gestión de espacios naturales.','Ingeniero/a de montes.'],
vc:['Los pesticidas afectan a toda la cadena trófica.','El compost aprovecha a los descomponedores.','Los tiburones regulan las poblaciones de peces que pescamos.'],
ac:[['Proliferación de medusas en el Mediterráneo','Relacionada con la sobrepesca de sus depredadores y el calentamiento del agua.'],['Crisis del Mar Menor','Ejemplo cercano de ecosistema alterado por el exceso de nutrientes.']],

B({id:'eso-ciclosmateria', c:['1eso','3eso','4eso'], t:'Ciclos de materia y flujo de energía', kw:['ciclo de la materia','flujo de energia','ciclo del carbono','ciclo del nitrogeno','piramide','biomasa','productividad','regla del 10','ciclos biogeoquimicos'],
an:[['La materia circula como el dinero en un pueblo cerrado: pasa de mano en mano y vuelve; la energía es como la batería del móvil: se gasta y hay que recargarla con el Sol.','El dinero no se pierde; la energía tampoco desaparece, se dispersa como calor.'],['La pirámide de energía es como un juego del teléfono escacharrado: en cada paso se pierde gran parte del mensaje.','La pérdida de energía sigue una proporción aproximada, no es aleatoria.']],
ej:['Para producir 1 kg de ternera hacen falta muchos kilos de pienso vegetal.','El carbono de tu cuerpo estuvo antes en el aire y en plantas.','Las leguminosas, gracias a bacterias, fijan nitrógeno del aire.'],
er:[['Creen que la energía se recicla como la materia.','Cuando un zorro se come un conejo, ¿pasa toda la energía del conejo al zorro?','La energía fluye en un sentido y se pierde como calor en cada nivel.'],['Piensan que los descomponedores destruyen la materia.','¿Desaparece un tronco que se pudre?','La transforman en sustancias minerales que vuelven al suelo y al aire.'],['Creen que la biomasa de los herbívoros es mayor que la de las plantas.','¿Hay más kilos de hierba o de vacas en un prado?','Pirámide: cada nivel tiene menos biomasa y energía.']],
di:[['Diferenciar ciclo y flujo.','Dibujar la materia en un círculo y la energía en una flecha recta que empieza en el Sol.'],['La regla del 10 %.','Contar con fichas: 1000 en productores, 100, 10, 1.']],
pr:['¿Por qué la energía no se recicla?','¿Por qué hay pocos superdepredadores?','¿Cómo vuelve el carbono a la atmósfera?'],
vo:[['Biomasa','masa de materia orgánica'],['Productor','fabrica materia orgánica'],['Ciclo biogeoquímico','recorrido de un elemento'],['Fijación del nitrógeno','paso del N2 del aire a compuestos útiles']],
en:[['P','¿Por qué no hay en el mundo tantos tigres como gacelas?'],['R','Con 1000 fichas de energía, repartid lo que llega a cada nivel de una cadena trófica.'],['C','El carbono de tu bocadillo estuvo en el aire hace unos meses.']],
pf:['Técnico/a en compostaje y gestión de residuos orgánicos.','Agrónomo/a: maneja fertilizantes y ciclo del nitrógeno.','Científico/a del clima que estudia el ciclo del carbono.'],
vc:['Comer más vegetales reduce la energía y la superficie agrícola necesaria.','El compost devuelve nutrientes al suelo.','Abonar en exceso contamina ríos y acuíferos con nitratos.'],
ac:[['Exceso de nitratos en acuíferos','Zonas vulnerables por contaminación agraria en la Comunitat Valenciana y Murcia.'],['Concentración récord de CO2','La curva de Mauna Loa sigue subiendo cada año.']],
act:[['Pirámide de fichas','Reparten fichas de energía entre niveles tróficos y calculan pérdidas.','G',20],['Compostera escolar','Montan una compostera y registran temperatura y cambios.','G',30],['Ciclo del carbono en cómic','Dibujan el viaje de un átomo de carbono por la naturaleza.','I',40],['¿Cuánto cuesta un kilo?','Comparan la energía y superficie necesarias para producir alimentos vegetales y animales.','P',30]],

B({id:'eso-procesosexternos', c:['1eso','3eso'], t:'Procesos externos y modelado del relieve', kw:['proceso externo','procesos externos','meteorizacion','erosion','transporte','sedimentacion','modelado','relieve','agente geologic','torrente','glaciar','karst','duna','paisaje'],

an:[['El aparato digestivo es una cadena de desmontaje: entra un alimento complejo y sale en piezas sueltas que pasan a la sangre.','En la cadena las piezas se recolocan; aquí se absorben.'],['Las vellosidades intestinales son como una toalla de rizo: muchísima superficie en poco espacio.','La toalla no absorbe selectivamente.']],
ej:['El intestino delgado mide varios metros.','El estómago se protege de su propio ácido con una capa de moco.','La microbiota intestinal pesa en torno a un kilo o menos y es clave para la salud.'],
er:[['Creen que la digestión ocurre sobre todo en el estómago.','¿Dónde se absorben los nutrientes?','La mayor parte de la digestión y absorción es en el intestino delgado.'],['Confunden digestión con nutrición.','¿Acaba la nutrición en el intestino?','Digestión es una parte; luego vienen circulación, respiración celular y excreción.'],['Piensan que las heces son solo comida no digerida.','¿Qué más contienen?','Bacterias, células de descamación, agua y fibra.']],
di:[['Diferenciar digestión mecánica y química.','Pan masticado (mecánica) y con saliva en tubo con lugol (química).'],['Recordar órganos y glándulas anejas.','Delantal o camiseta con los órganos para montar en clase.']],
pr:['¿Qué hace la saliva?','¿Por qué el intestino tiene vellosidades?','¿Qué función tiene el hígado en la digestión?'],
vo:[['Enzima','acelera reacciones químicas'],['Bolo alimenticio','alimento masticado'],['Quimo','pasta del estómago'],['Microbiota','bacterias del intestino']],

pf:['Gastroenterólogo/a.','Dietista-nutricionista.','Investigador/a en microbiota.'],

ac:[['Trasplantes de microbiota fecal','Tratamiento real para algunas infecciones intestinales.'],['Microbiota y salud mental','Investigaciones sobre el eje intestino-cerebro.']],
act:[['Digestión del almidón','Saliva y almidón con lugol a distintas temperaturas.','L',40],['Intestino a escala','Cuerda o lana con la longitud real de cada tramo.','G',20],['Digestión en bolsa','Simulación con galleta, agua y vinagre en bolsa y media de nailon.','G',30],['Viaje de una pizza','Relato del recorrido de un bocado.','I',30]],

B({id:'e3-respiratorio', c:['3eso','bhs1'], t:'Aparato respiratorio', kw:['respiratorio','respiracion','pulmon','alveolo','bronquio','traquea','ventilacion','inspiracion','espiracion','diafragma','intercambio de gases','tabaco'],

er:[['Confunden respiración y ventilación.','¿Las células respiran?','Ventilación: mover aire; respiración celular: obtener energía en las células.'],['Creen que espiramos solo CO2.','¿Por qué funciona el boca a boca?','El aire espirado aún tiene bastante oxígeno.'],['Piensan que los pulmones se mueven solos.','¿Qué músculo hace entrar el aire?','El diafragma y los intercostales.']],

vo:[['Alvéolo','saco donde se intercambian gases'],['Diafragma','músculo de la ventilación'],['Capacidad pulmonar','volumen máximo de aire'],['Cilios','pelillos que limpian las vías']],

pf:['Neumólogo/a.','Fisioterapeuta respiratorio.','Técnico/a en emergencias sanitarias.'],
vc:['Las mascarillas filtran partículas.','El asma y la contaminación del aire.','Respirar por la nariz calienta y filtra el aire.'],

B({id:'e3-circulatorio', c:['3eso','bhs1'], t:'Aparato circulatorio', kw:['circulatorio','circulacion','corazon','sangre','vaso sanguineo','arteria','vena','capilar','linfa','plasma','globulo','presion arterial','pulso'],
an:[['El aparato circulatorio es como la red de autobuses de una ciudad: la sangre lleva pasajeros (oxígeno, nutrientes) y recoge residuos.','Los autobuses van y vuelven; la sangre recorre un circuito cerrado doble.'],['El corazón son dos bombas pegadas: la derecha manda sangre a los pulmones y la izquierda al resto del cuerpo.','Las dos laten a la vez y comparten tabique.']],
ej:['El corazón late unas 100 000 veces al día.','Si pusiéramos en fila todos los vasos sanguíneos, darían más de dos vueltas a la Tierra.','La sangre venosa no es azul: es rojo oscuro.'],
er:[['Creen que la sangre de las venas es azul.','¿De qué color sale la sangre en un análisis?','Es rojo oscuro; las venas se ven azuladas a través de la piel.'],['Piensan que las arterias siempre llevan sangre oxigenada.','¿Qué lleva la arteria pulmonar?','Arteria: sale del corazón, lleve lo que lleve.'],['Creen que el corazón está en el lado izquierdo.','¿Dónde está el corazón exactamente?','Está en el centro, ligeramente inclinado a la izquierda.']],
di:[['La circulación doble.','Esquema con dos colores y recorrido en voz alta, o circuito en el suelo del aula.'],['Distinguir arterias, venas y capilares.','Tabla con pared, presión, válvulas y dirección.']],
pr:['¿Qué diferencia una arteria de una vena?','¿Por qué hablamos de circulación doble?','¿Qué función tienen las plaquetas?'],
vo:[['Aurícula','cavidad que recibe sangre'],['Ventrículo','cavidad que impulsa sangre'],['Capilar','vaso finísimo de intercambio'],['Plaquetas','coagulación']],
en:[['R','Toma tu pulso en reposo y después de 30 saltos: ¿cuánto cambia?'],['A','William Harvey demostró en 1628 que la sangre circula en circuito cerrado, contra lo que se creía desde hacía siglos.'],['P','¿Por qué los futbolistas a veces se desploman en el campo y qué es un desfibrilador?']],
pf:['Cardiólogo/a.','Técnico/a en emergencias que usa desfibriladores.','Hematólogo/a.'],
vc:['Los desfibriladores en lugares públicos.','La tensión arterial en la farmacia.','La donación de sangre.'],
ac:[['Desfibriladores en centros educativos','Formación en RCP y desfibriladores en institutos.'],['Enfermedades cardiovasculares','Siguen siendo la primera causa de muerte en el mundo.']],
act:[['Disección de corazón','Corazón de cerdo o cordero: cavidades, válvulas y vasos.','L',50],['Circuito en el suelo','Recorrido de la sangre marcado con cinta en el aula.','G',25],['Pulso y ejercicio','Registro y gráfica de frecuencia cardiaca.','P',30],['Taller de RCP','Práctica de compresiones con muñecos o peluches.','G',50]],
rec:[['Web','Consejo Español de RCP','Información y recursos para aprender RCP.','https://www.cercp.org/'],['Web','Fundación Española del Corazón','Salud cardiovascular explicada.','https://fundaciondelcorazon.com/'],['3D','Zygote Body','Sistema circulatorio en 3D.','https://www.zygotebody.com/']]});

B({id:'e3-excretor', c:['3eso','bhs1'], t:'Aparato excretor y homeostasis', kw:['excretor','excrecion','rinon','orina','nefrona','vejiga','urea','sudor','homeostasis','equilibrio interno','termorregulacion'],
an:[['El riñón es como un sistema de depuración: filtra mucho y luego recupera lo que vale.','Una depuradora no recupera nutrientes con tanta precisión.'],['La homeostasis es como el termostato de casa: si hace frío enciende la calefacción y si hace calor la apaga.','El cuerpo regula muchas variables a la vez, no solo la temperatura.']],
ej:['Los riñones filtran unos 180 litros de plasma al día, pero solo eliminamos 1-2 litros de orina.','Se puede vivir con un solo riñón.','El color de la orina indica la hidratación.'],
er:[['Confunden excreción y defecación.','¿Las heces son excreción?','Heces: restos no absorbidos; excreción: residuos del metabolismo.'],['Piensan que la orina sale directamente de lo que bebemos.','¿Por qué la orina lleva urea?','La orina se forma a partir de la sangre.'],['Creen que sudar es solo para eliminar sustancias.','¿Para qué sirve sudar?','Sobre todo para regular la temperatura.']],
di:[['Entender la nefrona.','Modelo con filtro de café y colador.'],['La idea de equilibrio dinámico.','Ejemplos de regulación: sed, sudor, temblor.']],
pr:['¿Qué órganos participan en la excreción?','¿Qué es la homeostasis?','¿Por qué sudamos al hacer ejercicio?'],
vo:[['Nefrona','unidad funcional del riñón'],['Urea','residuo nitrogenado'],['Diálisis','filtrado artificial de la sangre'],['Homeostasis','mantenimiento del medio interno']],
en:[['P','¿Por qué hacemos más pis en invierno que en verano?'],['A','La primera máquina de diálisis la construyó Willem Kolff en los años 40 con latas y piel de salchicha.'],['R','Observa el color de tu orina mañana: ¿estás bien hidratado?']],
pf:['Nefrólogo/a.','Enfermero/a de diálisis.','Técnico/a de laboratorio que analiza orina.'],
vc:['Beber agua en verano para evitar golpes de calor.','Los análisis de orina en revisiones médicas.','Los controles antidopaje se hacen con orina.'],
ac:[['Golpes de calor en olas de calor','Fallos de la termorregulación en veranos cada vez más cálidos.'],['Riñones de cerdo modificados para trasplante','Primeros xenotrasplantes experimentales en personas (2024).']],
act:[['Riñón artificial','Filtran agua con arena, colorante y sal con distintos filtros.','L',40],['Disección de riñón','Riñón de cordero: corteza, médula y pelvis.','L',50],['Termostato humano','Miden temperatura de la piel antes y después de ejercicio y lo explican.','P',25],['Mapa de la homeostasis','Esquema de variables reguladas y órganos implicados.','I',30]],

B({id:'e3-nervioso', c:['3eso','bhs1'], t:'Sistema nervioso y receptores', kw:['nervioso','neurona','cerebro','medula espinal','sinapsis','acto reflejo','receptor','sentido','ojo','oido','piel','encefalo','neurotransmisor','funcion de relacion'],
an:[['Las neuronas son como cables con un enchufe al final: el impulso viaja y en la sinapsis se pasa la señal con sustancias químicas.','En los cables viaja electricidad; en la neurona, cambios de carga en la membrana.'],['El acto reflejo es como un atajo: la médula responde antes de consultar al cerebro.','El cerebro se entera después y puede modificar la respuesta.']],
ej:['El impulso nervioso puede viajar a más de 100 m/s.','Santiago Ramón y Cajal ganó el Nobel en 1906 por descubrir que las neuronas son células independientes.','Tenemos muchos más sentidos que cinco: equilibrio, temperatura, dolor, posición del cuerpo.'],
er:[['Creen que solo usamos el 10 % del cerebro.','¿Qué zona del cerebro está apagada siempre?','Usamos todo el cerebro, aunque no todas las zonas a la vez.'],['Piensan que tenemos solo cinco sentidos.','¿Con qué sentido sabes si estás boca abajo con los ojos cerrados?','Hay más receptores: equilibrio, propiocepción, dolor...'],['Confunden nervio y neurona.','¿Un nervio es una neurona?','Un nervio es un haz de prolongaciones de muchas neuronas.']],
di:[['La sinapsis química.','Cadena de alumnos pasando un mensaje con una pelota entre manos.'],['Organización del sistema nervioso.','Esquema central/periférico y somático/autónomo con ejemplos de la vida diaria.']],
pr:['¿Qué partes tiene una neurona?','¿Qué es un acto reflejo?','¿Qué hace el cerebelo?'],
vo:[['Neurona','célula nerviosa'],['Sinapsis','conexión entre neuronas'],['Receptor','capta estímulos'],['Acto reflejo','respuesta rápida e involuntaria']],
en:[['R','Prueba de reacción: deja caer una regla entre los dedos de tu compañero y mide a qué altura la atrapa.'],['A','Cajal dibujó a mano las neuronas que veía al microscopio, y sus dibujos se siguen usando hoy.'],['P','¿Por qué no puedes hacerte cosquillas a ti mismo?']],
pf:['Neurólogo/a.','Óptico-optometrista.','Investigador/a en neurociencia o inteligencia artificial.'],
vc:['Usar casco en bici o patinete protege el encéfalo.','El móvil al volante reduce la capacidad de reacción.','Las gafas corrigen defectos del ojo.'],
ac:[['Interfaces cerebro-ordenador','Implantes que permiten a personas paralizadas mover cursores o escribir.'],['Uso de pantallas y sueño','Estudios sobre el efecto de las pantallas en adolescentes.']],
act:[['Test de la regla','Miden su tiempo de reacción y comparan con y sin distracciones.','P',25],['Mapa de sensibilidad','Prueba de los dos puntos con clips en distintas zonas de la piel.','P',30],['Ilusiones ópticas','Analizan por qué el cerebro se engaña.','G',25],['Disección de ojo','Ojo de vaca o cerdo: cristalino, retina y nervio óptico.','L',50]],
rec:[['Test','Human Benchmark: tiempo de reacción','Mide el tiempo de reacción en el navegador.','https://humanbenchmark.com/tests/reactiontime'],['Simulación','Neurona (PhET)','Cómo se transmite el impulso nervioso.','https://phet.colorado.edu/es/simulations/neuron'],['Web','Neuroscience for Kids','Experimentos y actividades sobre el sistema nervioso.','https://faculty.washington.edu/chudler/neurok.html']]});

B({id:'e3-endocrino', c:['3eso','bhs1'], t:'Sistema endocrino', kw:['endocrino','hormona','glandula','hipofisis','tiroides','insulina','diabetes','adrenalina','pancreas','suprarrenal','gonada'],

vo:[['Hormona','mensajero químico por la sangre'],['Glándula endocrina','vierte hormonas a la sangre'],['Célula diana','tiene el receptor de la hormona'],['Retroalimentación','regulación de una hormona por su efecto']],
en:[['P','¿Por qué te sudan las manos y se te acelera el corazón antes de un examen?'],['A','La insulina se descubrió en 1921 y en pocos meses niños diabéticos en coma se recuperaron.'],['R','Simulad con fichas la regulación de la glucosa tras un desayuno.']],
pf:['Endocrinólogo/a.','Educador/a en diabetes.','Investigador/a farmacéutico.'],
vc:['Los medidores continuos de glucosa.','El jet lag y la melatonina.','El estrés crónico y el cortisol.'],
ac:[['Medicamentos agonistas de GLP-1','Fármacos contra la diabetes que se han popularizado también para adelgazar, con debate médico.'],['Sensores de glucosa','Cada vez más personas con diabetes usan sensores continuos.']],

B({id:'e3-drogas', c:['3eso','bhs1'], t:'Sustancias adictivas', kw:['droga','adiccion','alcohol','tabaco','cannabis','vapeo','vaper','sustancia adictiva','dependencia','tolerancia','apuesta','ludopatia','pantallas'],
an:[['La adicción es como un camino en la hierba: cuanto más se pisa, más marcado queda y más fácil es volver a él.','Los cambios cerebrales no siempre son reversibles.'],['La tolerancia es como acostumbrarse a la música alta: cada vez necesitas más volumen para notar lo mismo.','La tolerancia tiene bases químicas en los receptores.']],
ej:['El alcohol es la droga más consumida por adolescentes en España.','Los vapeadores pueden llevar nicotina aunque parezcan inofensivos.','Las apuestas online pueden generar adicción sin sustancia.'],
er:[['Creen que el tabaco de liar o el vapeo son inofensivos.','¿Qué contiene un vapeador?','Nicotina y otras sustancias con efectos en pulmones y cerebro.'],['Piensan que el alcohol estimula.','¿Por qué el alcohol hace perder reflejos?','Es depresor del sistema nervioso.'],['Creen que todo el mundo consume.','¿Qué porcentaje de adolescentes no fuma?','Los datos reales muestran que la mayoría no consume.']],

B({id:'b1-historiavida', c:['1bach','4eso'], t:'Historia de la vida en la Tierra', kw:['historia de la vida','origen de la vida','evolucion','extincion masiva','explosion cambrica','precambrico','paleozoico','mesozoico','cenozoico','grandes grupos','estromatolito','gran oxidacion'],

ej:['Durante casi 3000 millones de años la vida fue solo microscópica.','Los estromatolitos fósiles muestran vida hace unos 3500 millones de años.','La mayor extinción, al final del Pérmico, eliminó la gran mayoría de especies marinas.'],
er:[['Creen que la evolución tiene una dirección hacia el ser humano.','¿Las bacterias son menos evolucionadas que nosotros?','Todos los seres actuales llevan el mismo tiempo evolucionando.'],['Piensan que todos los dinosaurios se extinguieron.','¿Qué grupo de dinosaurios sobrevivió?','Las aves son dinosaurios.'],['Confunden explosión cámbrica con origen de la vida.','¿Había vida antes del Cámbrico?','Había vida microscópica y la fauna de Ediacara.']],
di:[['Las proporciones de tiempo.','Calendario de un año con acontecimientos.'],['Relacionar cambios geológicos y biológicos.','Línea del tiempo de dos carriles: geología y vida.']],
pr:['¿Qué causó la gran oxidación?','¿Qué es la explosión cámbrica?','Nombra dos extinciones masivas y su posible causa.'],
vo:[['Estromatolito','estructura formada por cianobacterias'],['Gran oxidación','aumento del oxígeno atmosférico'],['Explosión cámbrica','diversificación rápida de animales'],['Extinción masiva','pérdida rápida de muchas especies']],
en:[['P','Si la historia de la Tierra fuese un día de 24 horas, ¿a qué hora aparecemos los humanos?'],['R','Ordenad 15 tarjetas de acontecimientos de la historia de la vida sin mirar apuntes.'],['A','En Els Ports (Castellón) hay yacimientos con huesos y huellas de dinosaurios del Cretácico, como los de Morella.']],
pf:['Paleontólogo/a.','Museógrafo/a de ciencias naturales.','Astrobiólogo/a.'],
vc:['Las aves del jardín son dinosaurios.','El oxígeno que respiramos lo produjeron primero las cianobacterias.','El petróleo procede de seres vivos antiguos.'],

B({id:'b1-ciclocelular', c:['1bach','4eso','bio2'], t:'Ciclo celular: mitosis y meiosis', kw:['ciclo celular','mitosis','meiosis','interfase','cromosoma','cromatida','division celular','citocinesis','sobrecruzamiento','haploide','diploide','cancer'],

B({id:'e4-adn', c:['4eso'], t:'ADN, ARN y expresión génica', kw:['adn','arn','gen','genes','codigo genetico','dogma central','replicacion','transcripcion','traduccion','expresion genica','mutacion','proteina','nucleotido'],
an:[['El ADN es un libro de recetas guardado en la biblioteca (núcleo): no sale de allí; se hace una fotocopia (ARN mensajero) y en la cocina (ribosoma) se prepara el plato (proteína).','Un libro no se copia a sí mismo; el ADN sí se replica antes de cada división.'],['El código genético es un idioma de palabras de tres letras (codones) con un alfabeto de solo cuatro letras.','En un idioma real las palabras tienen distinta longitud; aquí todas tienen tres letras y no hay espacios.']],
ej:['Si estiramos el ADN de una sola célula humana mediría unos dos metros.','Compartimos gran parte de los genes con un plátano o con una mosca: el código genético es universal.','La insulina humana se fabrica en bacterias porque entienden el mismo código.'],
er:[['Creen que solo algunas células tienen ADN o que cada órgano tiene un ADN distinto.','¿Tiene el mismo ADN una célula del ojo que una del pie?','Todas las células tienen el mismo ADN; cambian los genes que se expresan.'],['Confunden gen, cromosoma y ADN.','¿Un cromosoma es un gen?','Escala: ADN → gen (fragmento) → cromosoma (ADN empaquetado).'],['Piensan que todas las mutaciones son malas.','¿Cómo aparecieron los ojos azules o la tolerancia a la lactosa?','Muchas son neutras y algunas favorables: son la fuente de la variabilidad.']],
di:[['Seguir el paso de ADN a proteína.','Ejercicio guiado con una secuencia corta y la tabla del código genético.'],['Imaginar la estructura en 3D.','Modelo de ADN con gominolas y palillos o papiroflexia.']],
pr:['¿Qué bases se emparejan en el ADN?','¿Dónde ocurren la transcripción y la traducción?','¿Por qué decimos que el código genético es universal?'],
vo:[['Codón','tres nucleótidos que codifican un aminoácido'],['ARN mensajero','copia del gen que sale del núcleo'],['Replicación','copia del ADN antes de dividirse'],['Mutación','cambio en la secuencia del ADN']],
en:[['A','Rosalind Franklin obtuvo la «Foto 51», la imagen clave para descubrir la doble hélice; Watson y Crick la vieron sin que ella lo supiera.'],['R','Descifrad un mensaje secreto escrito en codones con la tabla del código genético.'],['P','Si todas tus células tienen el mismo ADN, ¿por qué una neurona no se parece a una célula de la piel?']],
pf:['Genetista clínico/a.','Técnico/a de laboratorio de biología molecular.','Bioinformático/a que analiza genomas.'],
vc:['Las pruebas de paternidad y los test de ascendencia comparan ADN.','Las vacunas de ARNm de la COVID-19 aprovechan la traducción.','La policía científica identifica personas por su ADN.'],

B({id:'e4-evolucion', c:['4eso'], t:'Evolución: teorías, pruebas y especiación', kw:['evolucion','darwin','lamarck','seleccion natural','pruebas de la evolucion','especiacion','nuevas especies','adaptacion','evolucion humana','hominido','neodarwinismo','teoria sintetica','fosiles'],
an:[['La selección natural es como un filtro: no crea las variantes, solo deja pasar las que mejor funcionan en ese ambiente.','El filtro no tiene intención ni objetivo; y el ambiente cambia.'],['El árbol evolutivo es un arbusto con muchas ramas, no una escalera hacia el ser humano.','Algunas ramas se cruzan (hibridación), sobre todo en bacterias.']],
ej:['Las bacterias resistentes a antibióticos son evolución en tiempo real.','Las polillas del abedul cambiaron de color con la contaminación industrial.','Los pinzones de Galápagos tienen picos distintos según su alimento.'],
er:[['Creen que los individuos evolucionan durante su vida (lamarckismo).','¿Las jirafas estiraron el cuello y lo heredaron sus crías?','Evolucionan las poblaciones por variación y selección.'],['Piensan que el ser humano viene del chimpancé.','¿Somos descendientes o primos de los chimpancés?','Compartimos un antepasado común.'],['Creen que «teoría» significa suposición.','¿La gravitación es solo una teoría?','En ciencia, teoría es una explicación muy comprobada.']],
di:[['Imaginar tiempos evolutivos largos.','Relacionar con la escala del tiempo geológico y simulaciones aceleradas.'],['Desmontar la idea de propósito.','Evitar expresiones como «para» o «quiso»: insistir en variación y supervivencia.']],
pr:['¿Qué tres condiciones necesita la selección natural?','Di dos pruebas de la evolución.','¿Cómo se forma una especie nueva?'],
vo:[['Selección natural','reproducción diferencial de los mejor adaptados'],['Órganos homólogos','mismo origen, distinta función'],['Especiación','formación de especies nuevas'],['Aislamiento reproductivo','impide el cruce entre poblaciones']],

vc:['Las variantes de los virus de la gripe y la COVID-19.','La resistencia de las plagas a los pesticidas.','Las razas de animales domésticos por selección artificial.'],

B({id:'b2-replicacion', c:['bio2'], t:'Ácidos nucleicos y replicación del ADN', kw:['acido nucleico','adn','arn','nucleotido','doble helice','replicacion','semiconservativa','helicasa','polimerasa','fragmentos de okazaki','cebador','genoma','meselson'],

/* =========================================================================
   BIOSOFÍA — fase 1
   Estructura pensada para migrar a app web:
   - Store: capa de almacenamiento (dispositivo + Google Drive / OneDrive, en nube.js)
   - Modelo: estado en memoria + funciones puras de calendario/cálculo
   - Vistas: funciones que devuelven HTML a partir del estado
   - Acciones: manejadores delegados por data-a / data-f
   ========================================================================= */

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const dow = s => { const g = parseD(s).getDay(); return g === 0 ? 7 : g; }; // 1 = lunes
const mondayOf = s => addDays(s, 1 - dow(s));
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const todayStr = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const tmin = t => { if (!t) return 0; const [h,m] = t.split(':').map(Number); return h*60 + m; };
const DIAS = ['', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const DIAS_C = ['', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

/* alumnado: primera palabra = nombre, resto = apellidos; orden por apellidos */
function partirNombre(txt) {
  const t = txt.replace(/\t/g, ' ').replace(/\s+/g, ' ').trim();
  if (t.includes(',')) { const [ap, ...nm] = t.split(','); return { pila: nm.join(' ').trim(), apellidos: ap.trim() }; } // «Apellidos, Nombre»
  const w = t.split(' ');
  const dos = words(w.slice(0, 2).join(' '));
  if (w.length > 2 && COMPUESTOS.has(dos)) return { pila: w.slice(0, 2).join(' '), apellidos: w.slice(2).join(' ') };
  return { pila: w[0], apellidos: w.slice(1).join(' ') };
}
function fijarNombre(a) { if (a.pila === undefined) Object.assign(a, partirNombre(a.nombre || '')); a.nombre = [a.pila, a.apellidos].filter(Boolean).join(' '); return a; }

/* guardado con espera: una escritura a la vez por documento */
const Save = { dirty: new Set(), timer: null, busy: false, err: false };

async function flush() {

  Save.busy = true;
