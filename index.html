  for (const id of ids) {
    try { await Store.write(id, docData(id)); Save.err = false; }
    catch (e) {
      if (Store.mode === 'db' && (e?.code === 'invalid_argument' || e?.code === 'not_granted' || e?.code === 'revoked')) {
        Store.mode = 'local'; showBanner('No tienes permiso para guardar en la nube en este enlace. Tus datos se guardan solo en este navegador.');

/* ---------- modelo: calendario ---------- */
const grupo = id => S.grupos.find(g => g.id === id);
const franja = id => S.config.franjas.find(f => f.id === id);
const franjasOrd = () => [...S.config.franjas].sort((a, b) => tmin(a.inicio) - tmin(b.inicio));
function festivoDe(s) {
  if (dow(s) > 5) return 'Fin de semana';
  const c = S.config;
  if (c.inicio && s < c.inicio) return 'Antes del inicio de curso';
  if (c.fin && s > c.fin) return 'Fuera del curso';
  const f = c.festivos.find(x => x.desde && s >= x.desde && s <= (x.hasta || x.desde));
  return f ? (f.nombre || 'Festivo') : null;
}
const keyOf = (gid, fecha, fid) => `${gid}|${fecha}|${fid}`;
function parseKey(k) { const [grupoId, fecha, franjaId] = k.split('|'); return { grupoId, fecha, franjaId }; }
function sesionesDia(s, incluirFest) {
  if (!incluirFest && festivoDe(s)) return [];
  const d = dow(s);
  return S.config.horario.filter(h => h.dia === d && grupo(h.grupoId) && franja(h.franjaId))
    .map(h => ({ key: keyOf(h.grupoId, s, h.franjaId), fecha: s, franja: franja(h.franjaId), grupo: grupo(h.grupoId), aula: h.aula || '' }))
    .sort((a, b) => tmin(a.franja.inicio) - tmin(b.franja.inicio));
}
function otrosDia(s) {
  if (festivoDe(s)) return [];
  return S.config.horario.filter(h => h.dia === dow(s) && h.tipo && OTROS[h.tipo] && franja(h.franjaId))
    .map(h => ({ otro: true, tipo: h.tipo, fecha: s, franja: franja(h.franjaId), aula: h.aula ? (h.tipo === 'ae' && /^\w{1,6}$/.test(h.aula) ? 'Aula ' + h.aula : h.aula) : '' }));
}
function ocurrencias(gid, desde, hasta) {
  const out = []; const hs = S.config.horario.filter(h => h.grupoId === gid && franja(h.franjaId));
  if (!hs.length || !desde || !hasta) return out;
  let s = desde, guard = 0;
  while (s <= hasta && guard++ < 800) {
    if (!festivoDe(s)) hs.filter(h => h.dia === dow(s)).sort((a, b) => tmin(franja(a.franjaId).inicio) - tmin(franja(b.franjaId).inicio))
      .forEach(h => out.push({ key: keyOf(gid, s, h.franjaId), fecha: s, franja: franja(h.franjaId), aula: h.aula || '' }));
    s = addDays(s, 1);

}
const cursoRango = () => [S.config.inicio || addDays(todayStr(), -60), S.config.fin || addDays(todayStr(), 240)];
function numSesion(key) { const { grupoId } = parseKey(key); const occ = ocurrencias(grupoId, ...cursoRango()); const i = occ.findIndex(o => o.key === key); return i < 0 ? null : { n: i + 1, total: occ.length }; }
function sesionVecina(key, dir) { const { grupoId } = parseKey(key); const occ = ocurrencias(grupoId, ...cursoRango()); const i = occ.findIndex(o => o.key === key); return i < 0 ? null : occ[i + dir] || null; }

function sesionCronologica(key, dir) {

/* estado de planificación de una sesión */
function estadoPlan(key) {

function desplazar(key, motivo) {

  for (let k = occ.length - 2; k >= i; k--) {
    const from = occ[k].key, to = occ[k + 1].key;
    if (S.planes[from] && !S.planes[from].sinClase) { S.planes[to] = S.planes[from]; touchPlan(to); moved++; }

/* ideas que encajan con una sesión */
function ideasPara(key) {

  const texto = words([p.titulo, p.unidad, p.etiquetas, p.objetivos].join(' '));

    if (ocultas.includes(i.id)) return false;
    const amb = i.ambito || 'todos';

/* agenda: recordatorios para una fecha */
function recordatoriosDe(s) {

    const n = diffDays(s, a.fecha); const r = a.recordar || { antes: true, mismo: true };
    const offs = [r.mismo && 0, r.antes && 1, r.tres && 3, r.semana && 7].filter(x => x !== false && x !== undefined);
    return offs.includes(n) ? { a, n } : null;
  }).filter(Boolean).sort((x, y) => x.n - y.n);
}
const pendGrupo = gid => (S.pendgrupo[gid] || []);

/* seguimiento por alumno (sin motor de calificaciones: solo registros) */
function seguimiento(gid) {
  const g = grupo(gid); const P = S.config.pesos; const out = {};
  g.alumnos.forEach(a => out[a.id] = { F: 0, J: 0, R: 0, deb: [], tra: [], act: [], actTags: {}, preg: [], bano: 0, notas: 0, sesiones: 0 });
  Object.keys(S.regs).forEach(k => {
    if (!k.startsWith(gid + '|')) return; const r = S.regs[k];
    g.alumnos.forEach(a => {
      const o = out[a.id]; const as = r.asis?.[a.id];
      if (r.asis && Object.keys(r.asis).length || r.deberes || r.trabajo) o.sesiones++;
      if (as === 'F') o.F++; if (as === 'J') o.J++; if (as === 'R') o.R++;
      if (r.deberes?.[a.id]) o.deb.push(P.val3[r.deberes[a.id]]);
      if (r.trabajo?.[a.id]) o.tra.push(P.val3[r.trabajo[a.id]]);
      const av = actVal(r.actitud?.[a.id]); if (av) { if (av.n) o.act.push(av.n); (av.tags || []).forEach(t => { o.actTags[t] = (o.actTags[t] || 0) + 1; }); }
      (r.sorteos || []).filter(x => x.alumnoId === a.id && x.val && x.val !== 'skip').forEach(x => o.preg.push(P.sorteo[x.val]));
      o.bano += (r.bano || []).filter(x => x.alumnoId === a.id && x.permitido !== undefined).length;
      o.notas += (r.notas || []).filter(x => x.alumnoId === a.id).length;
    });
  });
  const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null;
  Object.values(out).forEach(o => {
    o.debM = avg(o.deb); o.traM = avg(o.tra); o.actM = avg(o.act); o.pregM = avg(o.preg);
    o.trabajoClase = avg([...o.tra, ...o.preg]); // cada registro de trabajo y cada pregunta cuentan como un ítem más
  });
  return out;
}
const n1 = v => v === null || v === undefined ? '—' : (Math.round(v * 10) / 10).toLocaleString('es-ES');

/* ---------- alertas para Hoy ---------- */
function alertas(s) {
  const out = [];
  const man = siguienteLectivo(s);
  const sinPlan = sesionesDia(man).filter(x => estadoPlan(x.key).c === 'bad');
  if (sinPlan.length) out.push({ c: 'bad', t: `<b>${sinPlan.length} ${sinPlan.length === 1 ? 'sesión' : 'sesiones'} sin planificar</b> para ${diffDays(s, man) === 1 ? 'mañana' : fLong(man)}: ${sinPlan.map(x => esc(x.grupo.nombre)).join(', ')}.`, key: sinPlan[0].key });
  const hoySin = sesionesDia(s).filter(x => estadoPlan(x.key).c === 'bad');
  if (hoySin.length) out.push({ c: 'bad', t: `<b>Hoy</b> tienes ${hoySin.length} ${hoySin.length === 1 ? 'sesión' : 'sesiones'} sin planificar.`, key: hoySin[0].key });
  const venc = S.agenda.filter(a => !a.done && a.fecha && a.fecha < s);
  if (venc.length) out.push({ c: 'warn', t: `<b>${venc.length} ${venc.length === 1 ? 'tarea vencida' : 'tareas vencidas'}</b> en la agenda.`, go: 'agenda' });
  S.agenda.filter(a => !a.done && a.tipo === 'examen' && a.grupoId && !a.comunicado && a.fecha >= s && diffDays(s, a.fecha) <= (S.config.avisos.examenDias || 7))
    .forEach(a => out.push({ c: 'warn', t: `<b>Examen sin comunicar</b>: ${esc(a.titulo)} (${esc(grupo(a.grupoId)?.nombre || '')}), ${rel(diffDays(s, a.fecha))}.`, go: 'agenda' }));
  S.grupos.forEach(g => {
    const keys = Object.keys(S.regs).filter(k => k.startsWith(g.id + '|') && Object.keys(S.regs[k].deberes || {}).length).sort((a, b) => parseKey(a).fecha.localeCompare(parseKey(b).fecha));
    const last3 = keys.slice(-3); if (last3.length < 3) return;
    g.alumnos.forEach(a => { if (last3.every(k => S.regs[k].deberes[a.id] === 'no')) out.push({ c: 'warn', t: `<b>${esc(a.nombre)}</b> (${esc(g.nombre)}) lleva 3 revisiones seguidas sin deberes.`, go: 'grupo', gid: g.id }); });
  });
  return out;
}

  } else if (t === 'alumnado') {

      ${g.alumnos.length ? `<div class="list">${g.alumnos.map(a => `<div class="li" style="flex-wrap:wrap"><input type="text" value="${esc(a.apellidos || '')}" placeholder="Apellidos" data-f="alnombre" data-k="apellidos" data-id="${a.id}" style="flex:2;min-width:160px" aria-label="Apellidos"><input type="text" value="${esc(a.pila || '')}" placeholder="Nombre" data-f="alnombre" data-k="pila" data-id="${a.id}" style="flex:1;min-width:110px" aria-label="Nombre">
        <div class="row" style="width:100%">${TAGS.map(tg => `<label class="check tiny"><input type="checkbox" data-f="altag" data-id="${a.id}" data-t="${esc(tg)}" ${a.tags?.includes(tg) ? 'checked' : ''}>${esc(tg)}</label>`).join('')}</div>
        <input type="text" placeholder="Observaciones (medidas, permisos…)" value="${esc(a.obs || '')}" data-f="alobs" data-id="${a.id}" style="flex:1"><button class="iconbtn" data-a="delal" data-id="${a.id}" aria-label="Eliminar alumno">✕</button>
        <div class="row" style="width:100%"><input type="text" placeholder="Materia pendiente de otro curso (p. ej. ByG 1.º ESO)" value="${esc(a.pendiente || '')}" data-f="alpend" data-id="${a.id}" style="flex:1;min-width:200px">${a.pendiente ? `<span class="small muted">Recuperada</span><div class="seg"><button data-a="alrecup" data-id="${a.id}" data-v="1" aria-pressed="${!!a.pendRecuperada}">Sí</button><button data-a="alrecup" data-id="${a.id}" data-v="0" aria-pressed="${!a.pendRecuperada}">No</button></div>` : ''}</div></div>`).join('')}</div>` : `<p class="empty">Sin alumnos todavía.</p>`}</div>

        <div class="panel"><h3>Sin sitio <span class="muted small">${sin.length}</span></h3>${sin.length ? `<div class="sinsitio">${sin.map(a => `<button class="chipal ${UI.planoSel === a.id ? 'sel' : ''}" data-a="planosel" data-id="${a.id}" draggable="true" data-drag="${a.id}">${esc(a.nombre)}</button>`).join('')}</div>` : '<p class="empty">Todos tienen sitio.</p>'}</div>
      </div><div class="panel stack">

        <p class="small muted" style="margin:0">Arrastra a los alumnos, o toca uno y luego el sitio donde va. Si el sitio está ocupado, se intercambian.</p></div>
        ${panelReglas(g)}
      </div></div>`;
    }
  } else if (t === 'tutoria' && esTutoria(g)) {
    body = tabTutoria(g);
  } else if (t === 'seguimiento' && UI.segVista === 'sesiones' && g.alumnos.length) {
    body = segToggle() + tablaRegistros(g);
  } else if (t === 'seguimiento') {
    const seg = seguimiento(g.id);
    body = g.alumnos.length ? segToggle() + `<div class="panel"><p class="small muted" style="margin-top:0">Resumen de lo registrado en el modo directo. Escala: sí ${S.config.pesos.val3.si} · a medias ${S.config.pesos.val3.medias} · no ${S.config.pesos.val3.no}. <b>Trabajo en clase</b> es la media de todos sus ítems: cada registro de trabajo diario y cada pregunta del sorteo cuentan como uno más. Cuánto pesa en la nota se decidirá en la evaluación (última fase).</p>
      <div class="tablewrap"><table class="data"><tr><th>Alumno</th><th>Faltas</th><th>Just.</th><th>Retrasos</th><th>Deberes</th><th>Trabajo diario</th><th>Preguntas</th><th>Trabajo en clase (media)</th><th>Actitud (1–5)</th><th>Baño</th></tr>
      ${g.alumnos.map(a => { const o = seg[a.id]; return `<tr><td>${esc(a.nombre)}${(a.tags || []).map(x => ` <span class="tag">${esc(x)}</span>`).join('')}${a.pendiente ? ` <span class="pill ${a.pendRecuperada ? 'ok' : 'warn'}">Pte. ${esc(a.pendiente)}${a.pendRecuperada ? ' ✓' : ''}</span>` : ''}</td><td class="num">${o.F || ''}</td><td class="num">${o.J || ''}</td><td class="num">${o.R || ''}</td><td class="num">${n1(o.debM)} <span class="tiny muted">(${o.deb.length})</span></td><td class="num">${n1(o.traM)}</td><td class="num">${n1(o.pregM)} <span class="tiny muted">(${o.preg.length})</span></td><td class="num"><b>${n1(o.trabajoClase)}</b></td><td class="num">${n1(o.actM)}${Object.keys(o.actTags).length ? `<div class="tiny" style="text-align:right">${Object.entries(o.actTags).map(([t, c]) => `<span style="color:var(--${ACT_POS.includes(t) ? 'ok' : 'bad'})">${esc(t)}${c > 1 ? ' ×' + c : ''}</span>`).join(' · ')}</div>` : ''}</td><td class="num">${o.bano || ''}</td></tr>`; }).join('')}</table></div></div>` : `<div class="panel empty">Añade alumnos para ver su seguimiento.</div>`;
  } else {
    body = `<div class="panel stack" style="max-width:560px"><div class="fgrid"><label class="f">Nombre del grupo<input type="text" value="${esc(g.nombre)}" data-f="gfield" data-k="nombre"></label>
      <label class="f">Nombre de la materia<input type="text" value="${esc(g.materia || '')}" data-f="gfield" data-k="materia"></label>

const segToggle = () => `<div class="row between" style="margin-bottom:12px"><div class="seg">${[['resumen', 'Resumen'], ['sesiones', 'Por sesiones (editable)']].map(([v, t]) => `<button data-a="segvista" data-v="${v}" aria-pressed="${(UI.segVista || 'resumen') === v}">${t}</button>`).join('')}</div></div>`;
const CAPAS_SEG = [['asis', 'Asistencia'], ['deberes', 'Deberes'], ['trabajo', 'Trabajo'], ['actitud', 'Actitud'], ['preguntas', 'Preguntas']];
function tablaRegistros(g) {
  const hoy = todayStr(); const capa = UI.segCapa || 'deberes';
  const m0 = parseD(UI.segMes || hoy); const first = ymd(new Date(m0.getFullYear(), m0.getMonth(), 1)); const last = ymd(new Date(m0.getFullYear(), m0.getMonth() + 1, 0));
  const occ = ocurrencias(g.id, first, last < hoy ? last : hoy).filter(o => !S.planes[o.key]?.sinClase);
  const celda = (o, a) => {
    const r = S.regs[o.key] || {}; let html = '';
    if (capa === 'asis') { const v = r.asis?.[a.id]; html = v ? `<span class="pill v-${v}">${v === 'R' ? 'R' : v === 'F' ? 'F' : 'J'}</span>` : '<span class="tiny muted">·</span>'; }
    else if (capa === 'actitud') { const v = actVal(r.actitud?.[a.id]); html = v ? `${v.n ? `<span class="pill ${v.n >= 4 ? 'ok' : v.n === 3 ? 'warn' : 'bad'}">${v.n}</span>` : ''}${(v.tags || []).length ? `<span class="tiny" title="${esc(v.tags.join(', '))}">${v.tags.map(t => ACT_POS.includes(t) ? '+' : '−').join('')}</span>` : ''}` : '<span class="tiny muted">·</span>'; }
    else if (capa === 'preguntas') { const l = (r.sorteos || []).filter(x => x.alumnoId === a.id && x.val && x.val !== 'skip'); html = l.length ? l.map(x => `<span class="pill ${x.val === 'bien' ? 'ok' : x.val === 'regular' ? 'warn' : 'bad'}">${x.val === 'bien' ? 'B' : x.val === 'regular' ? 'R' : 'N'}</span>`).join('') : '<span class="tiny muted">·</span>'; }
    else { const v = r[capa]?.[a.id]; html = v ? `<span class="pill v-${v}">${v === 'si' ? 'Sí' : v === 'medias' ? '½' : 'No'}</span>` : '<span class="tiny muted">·</span>'; }
    return `<td class="rc"><button class="rcell" data-a="segcell" data-k="${esc(o.key)}" data-id="${a.id}" aria-label="${esc(a.nombre)} ${fShort(o.fecha)}">${html}</button></td>`;
  };
  const leyenda = { asis: 'Toca para cambiar: presente (·) → R retraso → F falta → J justificada.', deberes: 'Toca para cambiar: sin marcar → Sí → ½ a medias → No.', trabajo: 'Toca para cambiar: sin marcar → Sí → ½ a medias → No.', actitud: 'Toca para poner nota del 1 al 5 y etiquetas.', preguntas: 'Toca para cambiar: B bien → R regular → N no sabe → quitar.' }[capa];
  return `<div class="panel"><div class="row between" style="margin-bottom:10px"><div class="seg">${CAPAS_SEG.map(([v, t]) => `<button data-a="segcapa" data-v="${v}" aria-pressed="${capa === v}">${t}</button>`).join('')}</div>
    <div class="row"><button class="btn sm" data-a="segmes" data-d="-1" aria-label="Mes anterior">‹</button><b>${cap(MESES[m0.getMonth()])} ${m0.getFullYear()}</b><button class="btn sm" data-a="segmes" data-d="1" aria-label="Mes siguiente">›</button></div></div>
    <p class="small muted" style="margin:0 0 8px">${leyenda} Los cambios se suman al resumen.</p>
    ${occ.length ? `<div class="tablewrap"><table class="data reg"><tr><th class="stick">Alumno</th>${occ.map(o => `<th title="${esc(S.planes[o.key]?.titulo || '')}"><a href="#" data-a="sesion" data-k="${esc(o.key)}" data-tab="directo">${fShort(o.fecha)}</a><div class="tiny muted">${esc(o.franja.inicio)}</div></th>`).join('')}</tr>
      ${g.alumnos.map(a => `<tr><td class="stick">${esc(a.nombre)}</td>${occ.map(o => celda(o, a)).join('')}</tr>`).join('')}</table></div>` : '<p class="empty">No hubo clases este mes (o aún no han llegado).</p>'}</div>`;
}

/* ===== SESIÓN ===== */
VIEWS.sesion = () => {

  if (!g || !f) { UI.view = 'hoy'; return VIEWS.hoy(); }
  const h = S.config.horario.find(x => x.grupoId === grupoId && x.franjaId === franjaId && x.dia === dow(fecha));
  const ns = numSesion(key); const p = S.planes[key]; const t = UI.sesTab;

  let body = '';

  else if (t === 'directo') body = tabDirecto(key, g, f, fecha);
  else if (t === 'sitios') body = tabSitios(g);
  else body = tabCierre(key, g);
  return `<div class="page-head"><div><div class="row small"><a href="#" data-a="go" data-v="plan">‹ Planificación</a>${prev ? `<span class="muted">·</span><a href="#" data-a="sesion" data-k="${esc(prev.key)}" data-tab="${UI.sesTab}">‹ Anterior: ${esc(prev.grupo.nombre)} (${prev.fecha === fecha ? '' : fShort(prev.fecha) + ' '}${esc(prev.franja.inicio)})</a>` : ''}${next ? `<span class="muted">·</span><a href="#" data-a="sesion" data-k="${esc(next.key)}" data-tab="${UI.sesTab}">Siguiente: ${esc(next.grupo.nombre)} (${next.fecha === fecha ? '' : fShort(next.fecha) + ' '}${esc(next.franja.inicio)}) ›</a>` : ''}</div>
    <h1 style="margin-top:6px">${gchip(g)} <span class="muted" style="font-weight:500">· ${esc(p?.titulo || 'Sin planificar')}</span></h1>

function cursoBanco(g) {

  if (/eso/.test(n)) return /(^|\D)4/.test(n) ? '4eso' : /(^|\D)3/.test(n) ? '3eso' : '1eso';

}
function temasBanco(key) {

  return { curso: c, auto };

function modal(html, still, cls) { $('#modal').innerHTML = `<div class="modal-bg" data-a="closebg"><div class="modal ${cls || ''}" role="dialog" aria-modal="true" ${still ? 'style="animation:none"' : ''}>${html}</div></div>`; }

function toast(t) { document.querySelectorAll('.toast').forEach(x => x.remove()); const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

function sortear() {
  const key = UI.sesion; const g = grupo(parseKey(key).grupoId); const r = reg(key);
  const pres = g.alumnos.filter(a => !['F', 'J'].includes(r.asis[a.id]) && !r.bano.some(b => b.alumnoId === a.id && b.permitido && !b.vuelve));
  if (!pres.length) { toast('No hay alumnos presentes'); return; }
  const cnt = {}; Object.keys(S.regs).filter(k => k.startsWith(g.id + '|')).forEach(k => (S.regs[k].sorteos || []).forEach(x => cnt[x.alumnoId] = (cnt[x.alumnoId] || 0) + 1));
  const w = pres.map(a => 1 / (1 + (cnt[a.id] || 0)) ** 2); const tot = w.reduce((s, x) => s + x, 0);
  let rnd = Math.random() * tot, pick = pres[0]; for (let i = 0; i < pres.length; i++) { rnd -= w[i]; if (rnd <= 0) { pick = pres[i]; break; } }
  UI.sorteado = pick.id;

async function exportar(obj, nombre) {
  const data = JSON.stringify(obj, null, 1); const filename = `${nombre}-${todayStr()}.json`;
  let dl = null; try { dl = Nube.descargas; } catch (e) {}
  if (dl) { try { await dl.save({ filename, data }); toast('Copia guardada'); return; } catch (e) { if (e?.code === 'declined') return; } }
  modal(`<h2>Copia de tus datos</h2><p class="small">No se ha podido descargar el archivo aquí. Copia este texto y guárdalo en un archivo <b>${esc(filename)}</b>.</p><textarea id="exp-t" rows="10" readonly>${esc(data)}</textarea><div class="row" style="margin-top:10px"><button class="btn primary" data-a="copyexp">Copiar</button><button class="btn" data-a="close">Cerrar</button></div>`);
}

  }).join('');
  const avg = vals => { const v = vals.filter(y => y !== null && y !== undefined); return v.length ? v.reduce((s, y) => s + y, 0) / v.length : null; };
  const foot = cols.map(c => {

      <td class="tot"><div class="row" style="flex-wrap:nowrap;justify-content:center;gap:4px"><input class="calcell${lowC(x.g)}" type="text" inputmode="decimal" placeholder="${esc(nf(x.calc, 2))}" value="${x.manual !== null ? esc(notaTxt(x.manual)) : ''}" data-f="calfinal" data-calre="1" data-al="${a.id}" data-r="${r}" data-c="0" data-fid="f-${a.id}" aria-label="Nota final de ${esc(a.nombre)}">${x.manual !== null ? `<button class="iconbtn" data-a="calfinreset" data-al="${a.id}" title="Volver a la calculada" aria-label="Volver a la nota calculada">↺</button>` : ''}</div>${x.manual !== null ? '<span class="pill warn" style="margin-top:2px">Modificada</span>' : ''}</td>

    ${Math.abs(tp - 100) > .01 && Object.keys(cal.evalPesos).length ? `<div class="alert warn small">Los porcentajes de las evaluaciones suman ${nf(tp)} %. Se reparten en proporción.</div>` : ''}</div>`;

function vistaComp(g, cal, ev) {
  if (!cal.curr) return `<div class="panel empty">Para ver las notas por competencias, elige el currículo del grupo en <a href="#" data-a="caltab" data-v="config">Configuración</a> y vincula los instrumentos o los ítems de las rúbricas a criterios de evaluación.</div>`;
  const C = currOf(cal); const R = ev === 'final' ? resFinal(g, cal) : resEval(g, cal, ev);
  const conNota = g.alumnos.filter(a => R[a.id].g !== null);
  const pesoMed = k => conNota.length ? conNota.reduce((s, a) => s + (R[a.id].ce[k]?.w || 0), 0) / conNota.length : 0;
  const pesoMedC = c => conNota.length ? conNota.reduce((s, a) => s + (R[a.id].crit[c]?.w || 0), 0) / conNota.length : 0;
  const ces = C.ce.filter(([n]) => pesoMed(String(n)) > 0);

  const showC = !!UI.calCrit;
  const sinCrit = conNota.length ? conNota.reduce((s, a) => s + R[a.id].sinCrit, 0) / conNota.length : 0;
  if (!conNota.length) return `<div class="panel empty">Todavía no hay notas en ${ev === 'final' ? 'el curso' : esc(evNombre(ev))}.</div>`;
  if (!ces.length) return `<div class="panel empty">Hay notas, pero ningún instrumento está vinculado a criterios de evaluación. Al crear o editar un instrumento, elige sus criterios (o los de cada ítem de la rúbrica), o pon criterios por defecto a una categoría en Configuración.</div>`;
  const colsCE = ces.map(([n, t, cr]) => { const k = String(n); const crs = cr.filter(c => pesoMedC(c[0]) > 0); return { k, t, crs }; });

  const h2 = showC ? colsCE.map(c => c.crs.map(([code, txt]) => `<th title="${esc(txt)}">${esc(code)}<span class="tiny muted" style="display:block">${nf(pesoMedC(code) * 100)} %</span></th>`).join('') + `<th class="sum">CE${c.k}</th>`).join('') : '';
  const rows = g.alumnos.map(a => { const x = R[a.id]; const m = Object.values(x.ce).reduce((s, o) => s + o.w * o.g, 0);
    return `<tr><td class="stick"><button class="alname" data-a="calal" data-al="${a.id}">${esc(a.apellidos ? a.apellidos + ', ' + (a.pila || '') : a.nombre)}</button></td>${colsCE.map(c => (showC ? c.crs.map(([code]) => `<td class="${lowC(x.crit[code]?.g).trim()}">${nf(x.crit[code]?.g, 2)}</td>`).join('') : '') + `<td class="sum${lowC(x.ce[c.k]?.g)}">${nf(x.ce[c.k]?.g, 2)}</td>`).join('')}
      <td class="sum">${x.g !== null && Object.keys(x.ce).length ? nf(Math.abs(m - (ev === 'final' ? x.calc : x.g)) < 1e-6 ? (ev === 'final' ? x.calc : x.g) : m, 2) : ''}</td><td class="tot${lowC(x.g)}">${nf(x.g, 2)}${ev === 'final' && x.manual !== null ? ' <span class="pill warn" title="Nota final modificada a mano: no coincide con las competencias">a mano</span>' : ''}</td></tr>`; }).join('');
  return `<div class="stack"><div class="panel stack" style="gap:8px"><div class="row between"><p class="small" style="margin:0">Cada criterio y cada competencia pesan lo que les llega de los instrumentos (el % que se ve en la cabecera, de media en el grupo). Por eso la <b>media ponderada de las competencias</b> coincide con la nota.</p>
      <label class="check small"><input type="checkbox" data-f="calcrit" ${showC ? 'checked' : ''}>Ver criterios</label></div>
      ${sinCrit > 1e-6 ? `<div class="alert info small">Un ${nf(sinCrit * 100)} % de la nota (de media) no está vinculado a ningún criterio, por ejemplo trabajo de clase. Se reparte entre todos los criterios en proporción a su peso: cada criterio queda como «${nf((1 - sinCrit) * 100)} % de sus evidencias + ${nf(sinCrit * 100)} % de lo que no tiene criterio».</div>` : ''}</div>
    <div class="panel" style="padding:0"><div class="tablewrap"><table class="nt"><thead><tr><th class="stick" rowspan="${showC ? 2 : 1}">Alumno</th>${h1}<th class="sum" rowspan="${showC ? 2 : 1}">Media ponderada<br>de competencias</th><th class="tot" rowspan="${showC ? 2 : 1}">Nota<span class="tiny" style="display:block;font-weight:400">${ev === 'final' ? 'final' : esc(evNombre(ev))}</span></th></tr>${showC ? `<tr>${h2}</tr>` : ''}</thead><tbody>${rows}</tbody></table></div></div>
    ${sinEv.length || critSin.length ? `<div class="panel small"><b>Sin evidencias ${ev === 'final' ? 'en el curso' : 'en esta evaluación'}:</b> ${sinEv.length ? sinEv.map(([n]) => 'CE' + n).join(', ') + '. ' : ''}${critSin.length ? `Criterios: ${critSin.map(esc).join(', ')}.` : ''}</div>` : ''}</div>`;
}

function chipsCrit(codes, extra = '') { return (codes || []).length ? codes.map(c => `<span class="tag" title="${esc(critTexto(UI._calRef, c))}">${esc(c)}</span>`).join('') : `<span class="tiny muted">${extra || 'Ninguno'}</span>`; }
function nodoCfg(cal, n, parent, evC) {

  let bodyN = '';
  if (leaf) {
    const fk = FUENTES.filter(([k]) => n.fuentes?.[k] !== undefined);

    bodyN = `<div class="stack" style="gap:8px;margin-top:8px">
      <div><div class="label" style="margin-bottom:4px">Qué cuenta en esta nota</div><div class="row"><span class="tag">Instrumentos: ${instrN}</span>${FUENTES.map(([k, lab]) => `<label class="check small"><input type="checkbox" data-f="calfuente" data-id="${n.id}" data-k="${k}" ${n.fuentes?.[k] !== undefined ? 'checked' : ''}>${lab}</label>`).join('')}</div>
</div>
      ${fk.length ? `<div><div class="seg">${[['pond', 'Ponderación que elijo'], ['media', 'Media de todas las veces que se ha medido']].map(([v, t]) => `<button data-a="calmodo" data-id="${n.id}" data-v="${v}" aria-pressed="${(n.modo || 'pond') === v}">${t}</button>`).join('')}</div>
        ${(n.modo || 'pond') === 'pond' ? `<div class="row" style="margin-top:8px">${[['_instr', 'Instrumentos', n.pesoInstr], ...fk.map(([k, lab]) => [k, lab, n.fuentes[k]])].map(([k, lab, v]) => `<label class="row small" style="gap:4px;flex-wrap:nowrap">${lab}<input type="number" min="0" class="pct" value="${esc(String(v ?? 0))}" data-f="calfw" data-id="${n.id}" data-k="${k}" data-calre="1">%</label>`).join('')}<span class="small ${Math.abs(sumP - 100) > .01 ? 'warnc' : 'muted'}">Suma ${nf(sumP)} %</span></div>`
          : `<p class="tiny muted" style="margin:6px 0 0">Cada registro (cada sesión de trabajo, cada revisión de deberes, cada pregunta, cada actitud) y cada instrumento cuentan lo mismo.</p>`}</div>` : ''}
      ${instrN > 1 || n.reparto === 'mano' ? `<div class="row"><span class="small muted">Entre instrumentos:</span><div class="seg">${[['igual', 'Todos pesan igual'], ['mano', 'Peso de cada uno a mano']].map(([v, t]) => `<button data-a="calreparto" data-id="${n.id}" data-v="${v}" aria-pressed="${(n.reparto || 'igual') === v}">${t}</button>`).join('')}</div></div>` : ''}

  const peorR = leaf ? `<div class="row small"><label class="check small"><input type="checkbox" data-f="calpeor" data-id="${n.id}" ${n.descartarPeor ? 'checked' : ''}>Quitar la peor nota de los instrumentos</label>${n.descartarPeor ? `<span class="muted">si hay al menos</span><input type="number" min="2" class="pct" value="${esc(String(n.descMin || 3))}" data-f="caldescmin" data-calre="1" data-id="${n.id}" aria-label="Número mínimo de notas"><span class="muted">notas</span>` : ''}</div>` : '';
  return `<div class="tree-node${parent ? ' sub' : ''}">${headR}${minR}${peorR}${bodyN}</div>`;
}

function panelRedondeo(cal) {
  const R = redDe(cal); const ej = [4.4, 4.5, 4.7, 6.5, 8.49].map(v => `${nf(v, 2)} → ${boletin(cal, v)}`).join(' · ');

  let bytes; try { bytes = await libroPDF(b, opt); } catch (e) { console.error(e); toast('No se ha podido crear el PDF'); return; }
  const nombre = ((b.titulo || 'libro').replace(/[^\p{L}\p{N} _-]/gu, '').trim().slice(0, 60) || 'libro') + (opt.unidad ? ' - ' + libL(b).ud + ' ' + (b.unidades.findIndex(u => u.id === opt.unidad) + 1) : '') + (opt.sol ? ' (con soluciones)' : '') + (opt.acc ? ' (accesible)' : '') + '.pdf';
  let dl = null; try { dl = Nube.descargas; } catch (e) {}
  if (dl) { try { await dl.save({ filename: nombre, data: bytes }); toast('PDF guardado'); } catch (e) { if (e?.code !== 'declined') toast('No se ha podido guardar el PDF'); } return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- libro en las sesiones ---------- */
const palabrasTema = s => new Set(words(s).replace(/[^a-z0-9ñ]+/g, ' ').split(' ').filter(w => w.length >= 4));
function libroSesion(key) {
  const g = grupo(parseKey(key).grupoId); if (!g || !g.asig || esTutoria(g)) return null;
  const mat = matDe().find(a => a.asig && a.asig === g.asig); if (!mat) return { mat: null };
  const p = S.planes[key] || {}; const libs = librosMat(mat.id); if (!libs.length) return { mat, b: null };
  const el = p.libro && !p.libro.no && libroDe(p.libro.lib); const b = el && el.mat === mat.id ? el : libs[0];
  if (p.libro?.no) return { mat, b, libs, ap: null, no: true };
  if (el && apDe(b, p.libro.ap)) return { mat, b, libs, ap: p.libro.ap };
  const ws = palabrasTema([p.titulo, p.unidad, p.etiquetas].join(' ')); let best = null, bs = 0;
  if (ws.size) apsLista(b).forEach(o => { const t = palabrasTema([o.a.titulo, o.a.temas, o.u.titulo].join(' ')); let s = 0; t.forEach(w => { if (ws.has(w)) s++; }); if (s > bs) { bs = s; best = o.a.id; } });
  return { mat, b, libs, ap: best, propuesto: !!best };
}
function libroSesionHTML(key) {
  const r = libroSesion(key); if (!r) return '';
  if (!r.mat) return `<p class="tiny muted" style="margin:0">📖 Para tener el libro aquí, crea la asignatura en <a href="#" data-a="go" data-v="materiales">Materiales</a> y escríbelo allí.</p>`;
  if (!r.b) return `<p class="tiny muted" style="margin:0">📖 La asignatura aún no tiene libro. <a href="#" data-a="go" data-v="materiales">Créalo en Materiales</a>.</p>`;
  const opts = r.libs.map(b => `<optgroup label="${esc(b.titulo)}">${apsLista(b).map(o => `<option value="${b.id}|${o.a.id}" ${b === r.b && o.a.id === r.ap ? 'selected' : ''}>${numAp(o.ui, o.ai)} ${esc(o.a.titulo)}</option>`).join('')}</optgroup>`).join('');
  return `<div class="row"><span class="label">📖 Libro</span><select data-f="seslib" style="flex:1;min-width:200px;width:auto" aria-label="Apartado del libro para esta sesión"><option value="_no" ${r.no || !r.ap ? 'selected' : ''}>— Ningún apartado —</option>${opts}</select>${r.propuesto ? '<span class="tiny muted">propuesto por los temas</span>' : ''}
    <button class="btn sm" data-a="seslibpres">▶ Presentar</button><button class="btn sm ghost" data-a="libabrir" data-id="${r.b.id}" data-ap="${r.ap || ''}">Abrir en el editor</button></div>`;
}

      ${!b.principal ? `<button class="btn sm ghost" data-a="libprincipal" data-id="${b.id}">Hacer principal</button>` : ''}<button class="btn sm" data-a="libpres" data-id="${b.id}">▶ Presentar</button></div>`; }).join('')}</div>` : `<p class="empty">Crea tus apuntes, compendios de actividades o esquemas. El libro principal se abre desde las sesiones de los grupos de ${a.asig ? 'esta asignatura' : 'esta asignatura (vincúlala al currículo en el panel de la derecha)'}.</p>`}</div>`;

/* ---------- arranque ---------- */
/* sincronización con otras copias abiertas (otra pestaña, el móvil…) */
function aplicarDoc(id, data) {
  if (Save.dirty.has(id)) return false; // tengo cambios propios sin guardar: mandan los míos
  const nuevo = data ? JSON.stringify(data) : null; if (nuevo === JSON.stringify(docData(id))) return false;
  if (id === 'config') { S.config = Object.assign(DEFAULT_CONFIG(), data || {}); S.config.pesos = Object.assign(DEFAULT_CONFIG().pesos, S.config.pesos || {}); }
  else if (['grupos', 'agenda', 'ideas', 'pendientes'].includes(id)) { S[id] = data?.list || []; if (id === 'grupos') S.grupos.forEach(g => { g.alumnos.forEach(a => { fijarNombre(a); if (a.tags?.includes('Recién llegado')) a.tags = [...new Set(a.tags.map(t => t === 'Recién llegado' ? 'Nouvingut' : t))]; }); ordenarAlumnos(g); }); }
  else if (id === 'pendgrupo') S.pendgrupo = data?.map || {};
  else if (id === 'materiales') S.materiales = normMat(data);
  else if (id.startsWith('libro_')) { if (data && data.id) S.libros[id.slice(6)] = data; else delete S.libros[id.slice(6)]; }
  else if (id.startsWith('cal_')) { if (data && data.arbol) S.cal[id.slice(4)] = data; else delete S.cal[id.slice(4)]; }
  else if (id.startsWith('plan_') || id.startsWith('reg_')) { const src = id.startsWith('plan_') ? S.planes : S.regs; const wk = id.slice(id.indexOf('_') + 1);
    Object.keys(src).forEach(k => { if (mondayOf(k.split('|')[1]) === wk) delete src[k]; }); Object.assign(src, data?.map || {}); }
  else return false;
  return true;
}

})();
